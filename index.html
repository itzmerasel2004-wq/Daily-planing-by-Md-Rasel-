<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI StudyOS — Personal Study Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ════════════════════════ 1. DESIGN TOKENS ════════════════════════ */
:root{
  --bg:#f4f1ea; --panel:#fdfcf8; --panel2:#ece8dd; --ink:#201f1a; --ink2:#5c5749; --ink3:#8f8a7a;
  --line:#e0dbcd; --line2:#d3cdbb; --accent:#2c6b4f; --accent-soft:#dfeae2; --accent-ink:#f2f7f3;
  --amber:#a9752c; --amber-soft:#f3e8d3; --danger:#ac4638; --danger-soft:#f4e0dc; --info:#38607f; --info-soft:#dfe9f0;
  --ok:#2c6b4f; --ok-soft:#dfeae2;
  --sh:0 1px 2px rgba(32,31,26,.05),0 10px 30px -18px rgba(32,31,26,.25);
  --sh-lg:0 2px 6px rgba(32,31,26,.07),0 24px 60px -24px rgba(32,31,26,.35);
  --r:14px; --r-sm:9px;
  --fd:"Fraunces",Georgia,serif; --fs:"Instrument Sans",-apple-system,sans-serif;
}
[data-theme="dark"]{
  --bg:#141612; --panel:#1b1e19; --panel2:#242821; --ink:#ece9dd; --ink2:#aaa898; --ink3:#7b796a;
  --line:#2b2f28; --line2:#383d33; --accent:#63a884; --accent-soft:#243529; --accent-ink:#0e130f;
  --amber:#d0a04c; --amber-soft:#332b1c; --danger:#d3716a; --danger-soft:#37231f; --info:#7ba7c4; --info-soft:#1f2b33;
  --ok:#63a884; --ok-soft:#243529;
  --sh:0 1px 2px rgba(0,0,0,.3),0 10px 30px -18px rgba(0,0,0,.6);
  --sh-lg:0 2px 6px rgba(0,0,0,.35),0 24px 60px -24px rgba(0,0,0,.7);
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--fs);background:var(--bg);color:var(--ink);font-size:14.5px;line-height:1.5;overflow:hidden;height:100dvh}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:var(--line2);border-radius:9px}::-webkit-scrollbar-track{background:transparent}
h1,h2,h3,.serif{font-family:var(--fd);font-weight:600;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums}
body.rm *{transition:none!important;animation:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ════════════════════════ 2. APP SHELL ════════════════════════ */
.app{display:grid;grid-template-columns:236px 1fr;grid-template-rows:58px 1fr;height:100dvh}
.sidebar{grid-row:1/3;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:14px 10px;overflow-y:auto;z-index:60}
.brand{display:flex;align-items:center;gap:10px;padding:6px 10px 16px}
.brand-mark{width:34px;height:34px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.brand h1{font-size:17px;line-height:1.1}
.brand small{display:block;font-family:var(--fs);font-weight:500;font-size:10.5px;color:var(--ink3);letter-spacing:.08em;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-label{font-size:10.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);padding:14px 12px 5px}
.nav button{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:var(--r-sm);color:var(--ink2);font-weight:500;text-align:left;width:100%;transition:background .15s,color .15s;font-size:13.5px}
.nav button:hover{background:var(--panel2);color:var(--ink)}
.nav button.on{background:var(--accent);color:var(--accent-ink);font-weight:600}
.nav button svg{width:17px;height:17px;flex:none}
.nav .badge{margin-left:auto;background:var(--danger);color:#fff;font-size:10.5px;font-weight:700;border-radius:99px;padding:1px 7px}
.nav button.on .badge{background:rgba(255,255,255,.28)}
.side-foot{margin-top:auto;padding:12px 6px 4px;border-top:1px solid var(--line);font-size:12px;color:var(--ink3)}
.side-foot .streak{display:flex;align-items:center;gap:8px;color:var(--ink2);font-weight:600;padding:6px 6px 10px}

.topbar{grid-column:2;display:flex;align-items:center;gap:12px;padding:0 18px;background:var(--bg);border-bottom:1px solid var(--line);z-index:40}
.topbar .clock{font-weight:600;font-size:14px;color:var(--ink2);white-space:nowrap}
.searchbox{position:relative;flex:1;max-width:460px}
.searchbox svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--ink3)}
.searchbox input{width:100%;padding:8px 12px 8px 34px;border:1px solid var(--line);border-radius:99px;background:var(--panel);font-size:13.5px}
.searchbox input:focus{border-color:var(--accent);outline:none}
.search-drop{position:absolute;top:calc(100% + 6px);left:0;right:0;max-height:60vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-lg);z-index:90;display:none}
.search-drop.open{display:block}
.sr-group{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--ink3);padding:9px 14px 3px}
.sr-item{display:flex;align-items:center;gap:9px;padding:8px 14px;cursor:pointer;font-size:13.5px}
.sr-item:hover{background:var(--panel2)}
.sr-item small{color:var(--ink3);margin-left:auto;flex:none}
.icon-btn{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:var(--ink2);position:relative;transition:background .15s}
.icon-btn:hover{background:var(--panel2)}
.icon-btn svg{width:18px;height:18px}
.icon-btn .dot{position:absolute;top:7px;right:7px;min-width:15px;height:15px;border-radius:99px;background:var(--danger);color:#fff;font-size:9.5px;font-weight:700;display:grid;place-items:center;padding:0 3px}
.burger{display:none}

main{grid-column:2;overflow-y:auto;padding:22px 24px 60px;scroll-behavior:smooth}
.view{max-width:1180px;margin:0 auto;animation:vin .25s ease}
@keyframes vin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ════════════════════════ 3. COMPONENTS ════════════════════════ */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.page-head h2{font-size:26px}
.page-head p{color:var(--ink2);font-size:13.5px}
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 15px;border-radius:10px;font-weight:600;font-size:13.5px;border:1px solid var(--line);background:var(--panel);color:var(--ink);transition:filter .15s,background .15s;white-space:nowrap}
.btn:hover{background:var(--panel2)}
.btn svg{width:15px;height:15px}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.pri:hover{filter:brightness(1.08)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink2)}
.btn.ghost:hover{background:var(--panel2);color:var(--ink)}
.btn.sm{padding:5px 11px;font-size:12.5px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.card .card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.card .card-h h3{font-size:15.5px}
.card .card-b{padding:16px 18px}
.grid{display:grid;gap:16px}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap}
.badge svg{width:11px;height:11px}
.b-ok{background:var(--ok-soft);color:var(--ok)} .b-warn{background:var(--amber-soft);color:var(--amber)}
.b-danger{background:var(--danger-soft);color:var(--danger)} .b-info{background:var(--info-soft);color:var(--info)}
.b-mut{background:var(--panel2);color:var(--ink2)} .b-acc{background:var(--accent-soft);color:var(--accent)}
.pbar{height:7px;background:var(--panel2);border-radius:99px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .5s ease}
.pbar.amber i{background:var(--amber)} .pbar.danger i{background:var(--danger)}
.empty{padding:34px 18px;text-align:center;color:var(--ink3);font-size:13.5px}
.empty svg{width:30px;height:30px;margin-bottom:8px;opacity:.5}
.row-item{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--line)}
.row-item:last-child{border-bottom:none}
.row-item .grow{flex:1;min-width:0}
.row-item .t{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-item .s{font-size:12px;color:var(--ink3)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:7px;background:var(--panel2);color:var(--ink2)}
.chip svg{width:11px;height:11px}
.subj-dot{width:9px;height:9px;border-radius:3px;flex:none}
.tabs{display:flex;gap:4px;background:var(--panel2);padding:4px;border-radius:11px;width:max-content;max-width:100%;overflow-x:auto}
.tabs button{padding:6px 13px;border-radius:8px;font-weight:600;font-size:12.5px;color:var(--ink2);white-space:nowrap}
.tabs button.on{background:var(--panel);color:var(--ink);box-shadow:var(--sh)}
abbr{cursor:help}

/* stat strip */
.stat-strip{display:flex;gap:0;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);overflow-x:auto}
.stat{flex:1;min-width:118px;padding:14px 16px;border-right:1px solid var(--line)}
.stat:last-child{border-right:none}
.stat .k{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--ink3);white-space:nowrap}
.stat .v{font-family:var(--fd);font-size:25px;font-weight:600;margin-top:2px;line-height:1.1}
.stat .v small{font-size:13px;font-family:var(--fs);font-weight:600;color:var(--ink3)}
.stat.warn .v{color:var(--amber)} .stat.bad .v{color:var(--danger)} .stat.good .v{color:var(--accent)}

/* timeline */
.tl{position:relative;padding-left:20px}
.tl::before{content:"";position:absolute;left:6px;top:8px;bottom:8px;width:2px;background:var(--line)}
.tl-item{position:relative;padding:0 0 16px 8px}
.tl-item::before{content:"";position:absolute;left:-19px;top:5px;width:12px;height:12px;border-radius:99px;background:var(--panel);border:3px solid var(--ink3)}
.tl-item.now::before{border-color:var(--accent);background:var(--accent)}
.tl-item.past{opacity:.55}

/* modal */
.mback{position:fixed;inset:0;background:rgba(20,20,15,.5);backdrop-filter:blur(3px);z-index:100;display:grid;place-items:center;padding:16px;animation:fin .18s ease}
@keyframes fin{from{opacity:0}to{opacity:1}}
.mback{animation:fin .18s ease}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--sh-lg);width:100%;max-width:560px;max-height:90dvh;display:flex;flex-direction:column;animation:min .22s cubic-bezier(.2,.9,.3,1.2)}
@keyframes min{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}
.modal.lg{max-width:760px}
.modal-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:18px 22px 0}
.modal-h h3{font-size:19px}
.modal-b{padding:16px 22px;overflow-y:auto}
.modal-f{display:flex;justify-content:flex-end;gap:9px;padding:0 22px 20px}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.frow .full{grid-column:1/-1}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:12px;font-weight:700;color:var(--ink2);margin-bottom:5px}
.fld input,.fld select,.fld textarea{width:100%;padding:9px 12px;border:1px solid var(--line2);border-radius:10px;background:var(--bg);font-size:13.5px}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--accent);outline:none}
.fld textarea{resize:vertical;min-height:74px}
.fld .range-wrap{display:flex;align-items:center;gap:10px}
.fld input[type=range]{flex:1;padding:0;accent-color:var(--accent)}
.fld .range-v{font-weight:700;min-width:26px;text-align:center;font-family:var(--fd)}
.hint{font-size:12px;color:var(--ink3);margin-top:4px}

/* toast */
#toasts{position:fixed;bottom:20px;right:20px;z-index:200;display:flex;flex-direction:column;gap:9px;max-width:360px}
.toast{background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:12px;box-shadow:var(--sh-lg);font-size:13.5px;font-weight:500;display:flex;gap:10px;align-items:flex-start;animation:tin .3s cubic-bezier(.2,.9,.3,1.2)}
.toast svg{width:16px;height:16px;flex:none;margin-top:1px}
.toast.ok svg{color:var(--ok)} .toast.warn svg{color:var(--amber)} .toast.bad svg{color:var(--danger)} .toast.info svg{color:var(--info)}
[data-theme="dark"] .toast{background:#eeeadd;color:#1b1a15}
@keyframes tin{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}

/* notif panel */
.npanel{position:fixed;top:64px;right:18px;width:min(380px,calc(100vw - 24px));max-height:70vh;overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-lg);z-index:95;display:none}
.npanel.open{display:block}
.nitem{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;gap:10px;font-size:13px}
.nitem:last-child{border:none}
.nitem .ni{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none}
.nitem .ni svg{width:15px;height:15px}
.nitem .when{font-size:11px;color:var(--ink3);margin-top:2px}
.nitem.unread{background:var(--accent-soft)}

/* dashboard */
.hero{display:grid;grid-template-columns:300px 1fr 320px;gap:16px;margin-bottom:16px}
.ring-wrap{display:flex;flex-direction:column;align-items:center;padding:20px}
.ring-wrap canvas{width:158px;height:158px}
.ring-num{font-family:var(--fd);font-size:33px;font-weight:600;margin-top:-116px;pointer-events:none;line-height:1}
.ring-lab{margin-top:84px;font-size:12px;font-weight:600;color:var(--ink3);text-align:center}
.brief{background:var(--accent);color:var(--accent-ink);border-radius:var(--r);padding:16px 18px;margin-bottom:16px;display:flex;gap:14px;align-items:flex-start}
.brief svg{width:20px;height:20px;flex:none;margin-top:2px}
.brief ol{margin:6px 0 0 18px}
.brief li{margin:2px 0}
.nowcard .blk{padding:12px 0;border-bottom:1px solid var(--line)}
.nowcard .blk:last-child{border:none}
.aicard{background:var(--panel);border:1px solid var(--accent);border-radius:var(--r);padding:16px;box-shadow:var(--sh);display:flex;flex-direction:column;gap:9px}
.aicard .why{display:flex;flex-wrap:wrap;gap:6px}
.dash-grid{display:grid;grid-template-columns:1.25fr 1fr;gap:16px;margin-bottom:16px}
.daybar{display:flex;height:44px;border-radius:10px;overflow:hidden;border:1px solid var(--line);margin:10px 0 6px}
.daybar .seg{position:relative;height:100%;min-width:4px}
.daybar .nowline{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--danger);z-index:2}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:11.5px;color:var(--ink2);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:9px;height:9px;border-radius:3px}

/* quick actions */
.qa{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:16px}
.qa button{display:inline-flex;align-items:center;gap:8px;padding:10px 15px;background:var(--panel);border:1px solid var(--line);border-radius:12px;font-weight:600;font-size:13px;color:var(--ink2);transition:all .15s;box-shadow:var(--sh)}
.qa button:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-1px)}
.qa button svg{width:15px;height:15px}

/* calendar */
.cal-head{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-dow{font-size:11px;font-weight:700;text-transform:uppercase;color:var(--ink3);text-align:center;padding:4px 0}
.cal-cell{background:var(--panel);border:1px solid var(--line);border-radius:10px;min-height:78px;padding:6px 7px;cursor:pointer;transition:border-color .15s;font-size:12px}
.cal-cell:hover{border-color:var(--accent)}
.cal-cell.out{opacity:.4}
.cal-cell.today{border-color:var(--accent);border-width:2px}
.cal-cell .d{font-weight:700;font-size:12.5px}
.cal-dots{display:flex;flex-wrap:wrap;gap:3px;margin-top:5px}
.cal-dots i{width:7px;height:7px;border-radius:99px}
.cal-ev{display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 9px;margin-bottom:6px;cursor:pointer;font-size:12.5px}
.cal-ev:hover{border-color:var(--accent)}
.week-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.week-col{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px;min-height:180px}
.week-col.today{border-color:var(--accent)}
.week-col .wh{font-weight:700;font-size:12px;text-align:center;padding-bottom:7px;border-bottom:1px solid var(--line);margin-bottom:8px}

/* focus */
.focus-wrap{max-width:520px;margin:0 auto;text-align:center}
.focus-ring{position:relative;width:270px;height:270px;margin:14px auto}
.focus-ring canvas{width:270px;height:270px}
.focus-time{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--fd);font-size:56px;font-weight:600}
.focus-ctl{display:flex;justify-content:center;gap:10px;margin:16px 0}

/* chat */
.chat-wrap{display:flex;flex-direction:column;height:calc(100dvh - 170px);max-height:760px}
.chat-log{flex:1;overflow-y:auto;padding:6px 2px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:82%;padding:11px 15px;border-radius:15px;font-size:13.5px;white-space:pre-wrap;word-break:break-word}
.msg.user{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px}
.msg.ai{align-self:flex-start;background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:4px;box-shadow:var(--sh)}
.msg.ai .src{display:block;margin-top:8px;font-size:11px;color:var(--ink3)}
.chat-in{display:flex;gap:9px;padding-top:12px;border-top:1px solid var(--line);margin-top:8px}
.chat-in input{flex:1;padding:11px 15px;border:1px solid var(--line2);border-radius:12px;background:var(--panel)}
.chat-in input:focus{border-color:var(--accent);outline:none}
.chips{display:flex;gap:7px;flex-wrap:wrap;padding-bottom:10px}
.chips button{font-size:12px;font-weight:600;padding:6px 12px;border-radius:99px;background:var(--panel2);color:var(--ink2)}
.chips button:hover{background:var(--accent-soft);color:var(--accent)}

/* subjects */
.subj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.subj-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:17px;box-shadow:var(--sh)}
.subj-card .sc-h{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.chapter{border:1px solid var(--line);border-radius:10px;margin-bottom:8px;overflow:hidden}
.chapter>.ch-h{display:flex;align-items:center;gap:9px;padding:9px 12px;background:var(--panel2);font-weight:600;font-size:13px;cursor:pointer}
.topic{display:flex;align-items:center;gap:8px;padding:7px 12px;border-top:1px solid var(--line);font-size:13px}
.topic .conf{margin-left:auto;font-size:11px;font-weight:700}

/* habits */
.habit-grid{display:grid;grid-template-columns:1fr auto;gap:0;font-size:12px}
.habit-cell{width:26px;height:30px;display:grid;place-items:center}
.habit-cell button{width:22px;height:22px;border-radius:7px;border:1px solid var(--line2);background:var(--panel)}
.habit-cell button.on{background:var(--accent);border-color:var(--accent)}
.habit-cell button.on::after{content:"";display:block;width:8px;height:8px;border-radius:2px;background:var(--accent-ink)}

/* onboarding */
.ob-step{display:none}.ob-step.on{display:block}
.ob-progress{display:flex;gap:6px;margin-bottom:18px}

"use strict";
/* ════════════════════════════ 1. UTILITIES ════════════════════════════ */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const pd=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);};

const PALETTE=['#2c6b4f','#a9752c','#38607f','#ac4638','#6b5b8f','#3f7a6e','#8a5a44','#5c6b2c','#8f3f62','#44688a'];

/* ════════════════════════════ 2. ICONS (inline SVG set) ════════════════════════════ */

 set:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>',

const I=(n,s=16)=>`<svg viewBox="0 0 24 24" width="${s}" height="${s}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[n]||''}</svg>`;

/* ════════════════════════════ 3. STORAGE (IndexedDB + localStorage mirror) ════════════════════════════ */
const Store=(()=>{
  const DB='studyos', SKEY='studyos_state_v1';
  let db=null, idbOK=false;
  function openIDB(){
    return new Promise(res=>{
      try{
        const r=indexedDB.open(DB,1);
        r.onupgradeneeded=()=>r.result.createObjectStore('kv');
        r.onsuccess=()=>{db=r.result;idbOK=true;res();};
        r.onerror=()=>res();
        setTimeout(()=>res(),1500);
      }catch(e){res();}
    });
  }
  const idbSet=v=>new Promise(res=>{if(!idbOK)return res();try{const t=db.transaction('kv','readwrite');t.objectStore('kv').put(v,'state');t.oncomplete=res;t.onerror=res;}catch(e){res();}});
  const idbGet=()=>new Promise(res=>{if(!idbOK)return res(null);try{const t=db.transaction('kv','readonly');const q=t.objectStore('kv').get('state');q.onsuccess=()=>res(q.result||null);q.onerror=()=>res(null);}catch(e){res(null);}});
  async function load(){
    await openIDB();
    let s=await idbGet();
    if(!s){try{s=JSON.parse(localStorage.getItem(SKEY)||'null');}catch(e){s=null;}}
    return s;
  }
  function saveSync(s){ // immediate lightweight mirror — used for critical writes
    try{localStorage.setItem(SKEY,JSON.stringify(s));}catch(e){console.warn('localStorage full',e);}
    idbSet(s);
  }
  return {load,saveSync,idbSet};
})();

/* ════════════════════════════ 4. STATE & DOMAIN ════════════════════════════ */
const REV_INTERVALS=[1,3,7,14,30]; // days per confidence 1..5
let state=null, saveTimer=null, chartRedraws=[], currentView='dash';
const SUBJECT_COLORS=PALETTE;

function freshState(){
  return {
    user:{name:'',goal:'',targetMin:180,onboarded:false,wake:'06:30',sleep:'23:00'},
    subjects:[], tasks:[], routine:[], sessions:[], revisions:[], exams:[], assignments:[],
    tests:[], mistakes:[], notes:[], goals:[], habits:[],
    notifications:[], aiChats:[], aiConfig:{enabled:false,baseUrl:'',key:'',model:''},
    settings:{theme:'light',sound:true,browserNotif:false,quiet:false,quietStart:'22:30',quietEnd:'07:30',reduceMotion:false,focusMin:25,breakMin:5},
    meta:{created:todayISO(),notifSent:{},lastOpen:null}
  };
}
function save(){clearTimeout(saveTimer);saveTimer=()=>{};saveTimer=setTimeout(()=>Store.saveSync(state),350);}
function saveNow(){clearTimeout(saveTimer);Store.saveSync(state);}

const subj=id=>state.subjects.find(s=>s.id===id);
const subjName=id=>subj(id)?.name||'General';
const subjColor=id=>subj(id)?.color||'#8f8a7a';
const newSubject=name=>({id:uid(),name,color:SUBJECT_COLORS[state.subjects.length%SUBJECT_COLORS.length],chapters:[],hours:0});
const PRIORITY={high:3,medium:2,low:1};
const STATUS=['Not Started','In Progress','Completed','Partially Completed','Skipped','Overdue'];
const statusBadge=st=>{
  const map={'Not Started':'b-mut','In Progress':'b-info','Completed':'b-ok','Partially Completed':'b-warn','Skipped':'b-mut','Overdue':'b-danger'};
  return `<span class="badge ${map[st]||'b-mut'}">${esc(st)}</span>`;
};

/* ---------- computed analytics (all from real data) ---------- */
function sessionsOn(iso){return state.sessions.filter(s=>s.date===iso);}
function minutesOn(iso){return sessionsOn(iso).reduce((a,s)=>a+(s.duration||0),0);}
function lastNDays(n){const out=[];for(let i=n-1;i>=0;i--)out.push(addDays(todayISO(),-i));return out;}
function taskStats(tasks=todayTasks()){
  return {total:tasks.length,done:tasks.filter(t=>t.status==='Completed').length,
    pending:tasks.filter(t=>['Not Started','In Progress','Partially Completed'].includes(t.status)).length,
    overdue:tasks.filter(t=>t.status!=='Completed'&&t.status!=='Skipped'&&((t.date&&t.date<todayISO())||(t.deadline&&t.deadline<todayISO()))).length};
}
function todayTasks(){return state.tasks.filter(t=>t.date===todayISO());}
function allOpenTasks(){return state.tasks.filter(t=>!['Completed','Skipped'].includes(t.status));}
function overdueTasks(){return allOpenTasks().filter(t=>(t.date&&t.date<todayISO())||(t.deadline&&t.deadline<todayISO())).sort((a,b)=>(a.deadline||a.date||'9999')<(b.deadline||b.date||'9999')?-1:1);}
function revisionsDue(){return state.revisions.filter(r=>r.due<=todayISO());}
function upcomingDeadlines(){
  const out=[];
  state.tasks.forEach(t=>{if(t.deadline&&!['Completed','Skipped'].includes(t.status))out.push({date:t.deadline,type:'Task',title:t.title,ref:t});});
  state.assignments.forEach(a=>{if(a.due&&a.progress<100)out.push({date:a.due,type:'Assignment',title:a.title,ref:a});});
  state.exams.forEach(e=>{if(e.date>=todayISO())out.push({date:e.date,type:'Exam',title:e.name,ref:e});});
  return out.sort((a,b)=>a.date<b.date?-1:1);
}
function streak(){
  let n=0,d=todayISO();
  const qualifies=iso=>minutesOn(iso)>=15;
  if(!qualifies(d))d=addDays(d,-1); // today not yet earned doesn't break yesterday's streak
  while(qualifies(d)&&n<3650){n++;d=addDays(d,-1);}
  return n;
}
function weekTotals(weeksAgo=0){
  const now=pd(todayISO()), dow=(now.getDay()+6)%7; // Monday start
  const mon=addDays(todayISO(),-dow-weeksAgo*7);
  let min=0;const bySubj={};let done=0,total=0;
  for(let i=0;i<7;i++){const d=addDays(mon,i);min+=minutesOn(d);
    sessionsOn(d).forEach(s=>bySubj[s.subjectId||'none']=(bySubj[s.subjectId||'none']||0)+s.duration);
    const dt=state.tasks.filter(t=>t.date===d);total+=dt.length;done+=dt.filter(t=>t.status==='Completed').length;}
  return {mon,min,bySubj,done,total};
}
function productivityScore(){
  const t=todayISO(), tgt=state.user.targetMin||180, today=minutesOn(t);
  const w=weekTotals();const comp=w.total?pct(w.done,w.total):0;
  const focusAvg=state.sessions.length?state.sessions.slice(-20).reduce((a,s)=>a+(s.focus||3),0)/(Math.min(20,state.sessions.length)*5):0;
  const att=Math.min(1,today/tgt);
  return Math.round(att*40+comp/100*35+focusAvg*25);
}
function weakTopics(limit=8){
  const score={};
  state.revisions.forEach(r=>{if(r.confidence&&r.confidence<=2){const k=subjName(r.subjectId)+' · '+r.topic;score[k]=(score[k]||0)+3;}});
  state.mistakes.forEach(m=>{const k=subjName(m.subjectId)+' · '+m.topic;score[k]=(score[k]||0)+2;});
  state.tasks.forEach(t=>{if(t.status==='Skipped'&&t.topic){const k=subjName(t.subjectId)+' · '+t.topic;score[k]=(score[k]||0)+1;}});
  return Object.entries(score).sort((a,b)=>b[1]-a[1]).slice(0,limit).map(([k,v])=>({name:k,weight:v}));
}
function subjectProgress(s){
  let tot=0,done=0;
  s.chapters.forEach(c=>c.topics.forEach(t=>{tot++;if(t.done)done++;}));
  return pct(done,tot);
}
function confLabel(c){return['','Very low','Low','Okay','Good','Strong'][c]||'—';}

/* ---------- revision engine ---------- */
function scheduleRevision(subjectId,topic,confidence){
  const due=addDays(todayISO(),REV_INTERVALS[Math.max(0,Math.min(4,confidence)-1)]);
  let r=state.revisions.find(v=>v.subjectId===subjectId&&v.topic.toLowerCase()===topic.toLowerCase());
  if(r){r.due=due;r.confidence=confidence;r.history.push({date:todayISO(),confidence});}
  else state.revisions.push({id:uid(),subjectId,topic,due,confidence,history:[{date:todayISO(),confidence}]});
  save();
}
function markTopicDone(s,ch,t,confidence){
  t.done=true;
  if(confidence)scheduleRevision(s.id,t.name,confidence);
  save();
}

/* ---------- "what should I do now" engine ---------- */
function recommendNow(){
  const t=todayISO(), tgt=state.user.targetMin||180, left=Math.max(0,tgt-minutesOn(t));
  const cands=[];
  state.tasks.forEach(k=>{
    if(['Completed','Skipped'].includes(k.status))return;
    const od=(k.date&&k.date<t)?daysBetween(k.date,t):0;
    const dd=k.deadline?daysBetween(t,k.deadline):99;
    let sc=PRIORITY[k.priority]||2 + od*2.5;
    sc=(PRIORITY[k.priority]||2)*2+od*2.5;
    if(dd<=0)sc+=4; if(dd>=1&&dd<=3)sc+=2;
    if(examNear(k.subjectId))sc+=3;
    cands.push({kind:'task',title:k.title,subject:k.subjectId,topic:k.topic,est:k.est||45,min:Math.min(k.est||45,Math.max(25,left||45)),sc,obj:k,
      why:[...(od?['overdue '+od+'d']:[]),...(dd<=0?['due today']:[]),...(examNear(k.subjectId)?['exam soon']:[]),...(k.priority==='high'?['high priority']:[])]});
  });
  state.revisions.forEach(r=>{
    if(r.due>t)return;
    let sc=2+(r.confidence<=2?3:0)+(examNear(r.subjectId)?2:0)+(r.due<t?1.5:0);
    cands.push({kind:'rev',title:'Revise: '+r.topic,subject:r.subjectId,topic:r.topic,est:25,min:25,sc,obj:r,
      why:[r.due<t?'revision overdue':'revision due today',...(r.confidence&&r.confidence<=2?['low confidence']:[]),...(examNear(r.subjectId)?['exam soon']:[])]});
  });
  if(!cands.length)return null;
  cands.sort((a,b)=>b.sc-a.sc);
  const c=cands[0];
  const reasons=c.why.length?c.why:['fits your remaining study target'];
  return {...c,reasons,targetLeft:left};
}
function examNear(subjectId){
  return state.exams.some(e=>e.subjectId===subjectId&&e.date>=todayISO()&&daysBetween(todayISO(),e.date)<=14);
}

/* ---------- outstanding center ---------- */
function outstandingItems(){
  const out=[];
  overdueTasks().forEach(t=>out.push({kind:'Task',title:t.title,subject:t.subjectId,date:t.date||t.deadline,deadline:t.deadline||t.date,priority:t.priority,est:t.est||45,obj:t,
    reason:t.date<todayISO()&&t.date!==t.deadline?'Scheduled '+(daysBetween(t.date,todayISO()))+' day(s) ago, not completed':'Past its deadline'}));
  state.assignments.forEach(a=>{if(a.due<a!==false&&a.due<todayISO()&&a.progress<100)out.push({kind:'Assignment',title:a.title,subject:a.subjectId,date:a.due,deadline:a.due,priority:a.priority,est:60,obj:a,reason:'Submission date has passed'});});
  state.revisions.forEach(r=>{if(r.due<todayISO())out.push({kind:'Revision',title:'Revise: '+r.topic,subject:r.subjectId,date:r.due,deadline:r.due,priority:r.confidence<=2?'high':'medium',est:25,obj:r,reason:'Spaced-repetition date passed'});});
  return out.sort((a,b)=>(b.priority==='high')-(a.priority==='high')||(a.deadline<b.deadline?-1:1));
}
function catchUpPlan(){
  const items=outstandingItems();
  const tgt=state.user.targetMin||180;
  const capToday=Math.max(60,tgt-minutesOn(todayISO())), capTmr=tgt;
  const today=[],tomorrow=[],later=[];let c1=capToday,c2=capTmr;
  items.forEach(it=>{
    if(it.est<=c1){today.push(it);c1-=it.est;}
    else if(it.est<=c2){tomorrow.push(it);c2-=it.est;}
    else later.push(it);
  });
  return {items,today,tomorrow,later,capToday:capToday-c1,capTmr:capTmr-c2};
}

/* ---------- routine helpers ---------- */
function routineFor(dateISO){
  const dow=pd(dateISO).getDay();
  return state.routine.filter(b=>b.repeat==='daily'||(b.repeat==='weekly'&&(b.days||[]).includes(dow))).sort((a,b)=>toMin(a.start)-toMin(b.start));
}
function routineGaps(blocks){
  const gaps=[];let prev=toMin(state.user.wake)*1||360;
  const wake=Math.min(...blocks.map(b=>toMin(b.start)),toMin(state.user.wake));
  const sleep=Math.max(...blocks.map(b=>toMin(b.end)),toMin(state.user.sleep));
  let cursor=wake;
  blocks.forEach(b=>{const s=toMin(b.start);if(s-cursor>=45)gaps.push({start:cursor,end:s});cursor=Math.max(cursor,toMin(b.end));});
  if(sleep-cursor>=45)gaps.push({start:cursor,end:sleep});
  return gaps;
}

let modalStack=[];
function modal(title,bodyHTML,footerHTML='',opts={}){
  const back=document.createElement('div');back.className='mback';
  back.innerHTML=`<div class="modal ${opts.lg?'lg':''}" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <div class="modal-h"><h3>${esc(title)}</h3><button class="icon-btn" data-close aria-label="Close">${I('x',18)}</button></div>
    <div class="modal-b">${bodyHTML}</div>${footerHTML?`<div class="modal-f">${footerHTML}</div>`:''}</div>`;
  document.body.appendChild(back);

  const f=back.querySelector('input,select,textarea,button:not([data-close])');if(f)setTimeout(()=>f.focus(),60);

function fieldHTML(f){

  let inner='';

    case 'select':inner=`<select name="${f.k}"${req}>${(f.o||[]).map(o=>{const ov=o.v??o,ol=o.l??o;return `<option value="${esc(ov)}"${String(ov)===String(v)?' selected':''}>${esc(ol)}</option>`;}).join('')}</select>`;break;
    case 'textarea':inner=`<textarea name="${f.k}"${req} placeholder="${esc(f.ph||'')}">${esc(v)}</textarea>`;break;
    case 'range':inner=`<div class="range-wrap"><input type="range" name="${f.k}" min="${f.min||1}" max="${f.max||5}" value="${v||3}" oninput="this.nextElementSibling.textContent=this.value"><span class="range-v">${v||3}</span></div>`;break;
    case 'checkbox':return `<div class="fld ${half}"><label style="display:flex;gap:8px;align-items:center;cursor:pointer"><input type="checkbox" name="${f.k}" ${v?'checked':''} style="width:auto"> ${esc(f.label)}</label></div>`;
    default:inner=`<input type="${f.t||'text'}" name="${f.k}" value="${esc(v)}"${req} ${f.min!==undefined?`min="${f.min}"`:''} ${f.step?`step="${f.step}"`:''} placeholder="${esc(f.ph||'')}>`.replace('>"','">');
  }

function formModal(title,fields,onSubmit,submitLabel='Save'){
  const body=`<form id="fform">${wrapFields(fields)}</form>`;

function wrapFields(fields){
  let html='',pair=[];
  fields.forEach(f=>{
    const full=f.half===false||f.t==='textarea'||f.t==='range';
    if(full){if(pair.length){html+=`<div class="frow">${pair.join('')}</div>`;pair=[];}html+=`<div class="frow"><div class="full">${fieldHTML(f)}</div></div>`;}

  });

function prepCanvas(cv){
  const dpr=window.devicePixelRatio||1,w=cv.clientWidth||300,h=cv.clientHeight||150;
  cv.width=w*dpr;cv.height=h*dpr;
  const ctx=cv.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);
  return {ctx,w,h};
}
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
function ringChart(cv,p,color){
  const {ctx,w,h}=prepCanvas(cv);const cx=w/2,cy=h/2,r=Math.min(w,h)/2-8,lw=11;
  ctx.lineWidth=lw;ctx.lineCap='round';
  ctx.strokeStyle=css('--panel2');ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.stroke();
  ctx.strokeStyle=color||css('--accent');
  ctx.beginPath();ctx.arc(cx,cy,r,-Math.PI/2,-Math.PI/2+Math.PI*2*Math.min(1,p/100));ctx.stroke();
}
function barChart(cv,data,{color,label}={}){
  const {ctx,w,h}=prepCanvas(cv);
  const padL=30,padB=20,padT=8, iw=w-padL-6, ih=h-padT-padB;
  const max=Math.max(1,...data.map(d=>d.v));
  ctx.strokeStyle=css('--line');ctx.fillStyle=css('--ink3');ctx.font='10px Instrument Sans';ctx.lineWidth=1;
  [0,.5,1].forEach(f=>{const y=padT+ih*(1-f);ctx.beginPath();ctx.moveTo(padL,y);ctx.lineTo(w-4,y);ctx.stroke();ctx.fillText(f?Math.round(max*f)+'':max+'',4,y+3);});
  const bw=Math.min(26,iw/data.length*0.62), step=iw/data.length;
  data.forEach((d,i)=>{
    const bh=ih*(d.v/max), x=padL+step*i+(step-bw)/2, y=padT+ih-bh;
    ctx.fillStyle=d.c||color||css('--accent');
    if(d.v>0){ctx.beginPath();ctx.roundRect(x,y,bw,Math.max(2,bh),4);ctx.fill();}
    else{ctx.fillStyle=css('--line');ctx.fillRect(x,padT+ih-2,bw,2);}
    ctx.fillStyle=css('--ink3');ctx.textAlign='center';
    if(data.length<=16||i%2===0)ctx.fillText(d.l,padL+step*i+step/2,h-6);
    ctx.textAlign='left';
  });
}
function lineChart(cv,data,{color,min=0,max}={}){
  const {ctx,w,h}=prepCanvas(cv);
  const padL=30,padB=18,padT=8,iw=w-padL-8,ih=h-padT-padB;
  const mx=max??Math.max(1,...data.map(d=>d.v)),mn=min;
  ctx.strokeStyle=css('--line');ctx.fillStyle=css('--ink3');ctx.font='10px Instrument Sans';
  [0,.5,1].forEach(f=>{const y=padT+ih*(1-f);ctx.beginPath();ctx.moveTo(padL,y);ctx.lineTo(w-4,y);ctx.stroke();ctx.fillText(String(Math.round(mn+(mx-mn)*f)),4,y+3);});
  if(data.length<2){ctx.fillText('not enough data yet',padL+10,padT+ih/2);return;}
  const X=i=>padL+iw*(i/(data.length-1)), Y=v=>padT+ih*(1-(v-mn)/(mx-mn));
  ctx.strokeStyle=color||css('--accent');ctx.lineWidth=2;ctx.lineJoin='round';ctx.beginPath();
  data.forEach((d,i)=>i?ctx.lineTo(X(i),Y(d.v)):ctx.moveTo(X(0),Y(d.v)));ctx.stroke();
  ctx.lineTo(X(data.length-1),padT+ih);ctx.lineTo(X(0),padT+ih);ctx.closePath();
  ctx.fillStyle=color||css('--accent');ctx.globalAlpha=.09;ctx.fill();ctx.globalAlpha=1;
  ctx.fillStyle=color||css('--accent');
  data.forEach((d,i)=>{ctx.beginPath();ctx.arc(X(i),Y(d.v),2.5,0,7);ctx.fill();});
}

    if(!state.mistakes.length)return 'Your Mistake Book is empty. When you record mistakes, I\'ll find repeated patterns and link them to revision.';
    const byTopic={};state.mistakes.forEach(m=>{const k=subjName(m.subjectId)+' · '+m.topic;byTopic[k]=byTopic[k]||[];byTopic[k].push(m);});
    const rep=Object.entries(byTopic).filter(([,v])=>v.length>=2).sort((a,b)=>b[1].length-a[1].length);
    let out=`You've logged ${state.mistakes.length} mistakes across ${Object.keys(byTopic).length} topics.\n\n`;
    if(rep.length){out+='Repeated patterns (fix these first):\n';rep.slice(0,4).forEach(([k,v])=>out+=`• ${k} — ${v.length} mistakes (${[...new Set(v.map(m=>m.type))].join(', ')})\n`);out+='\nSuggestion: schedule a focused practice block on the top topic and re-attempt each wrong question without notes.';}
    else out+='No topic repeats yet — that\'s healthy. Keep logging and patterns will surface automatically.';
    return out;
  },
  localWeeklyReview(){
    const w=weekTotals(),prev=weekTotals(1);
    const entries=Object.entries(w.bySubj).sort((a,b)=>b[1]-a[1]);
    let out=`Weekly review (${fmtDate(w.mon)} – ${fmtDate(addDays(w.mon,6))}):\n\n• Total study time: ${fmtMin(w.min)} (last week: ${fmtMin(prev.min)})\n`;
    if(entries.length){out+=`• Most studied: ${subjName(entries[0][0])} (${fmtMin(entries[0][1])})\n• Least studied: ${subjName(entries[entries.length-1][0])} (${fmtMin(entries[entries.length-1][1])})\n`;}
    out+=`• Tasks: ${w.done}/${w.total} completed\n`;
    const tw=state.tests.filter(x=>x.date>=w.mon&&x.date<=addDays(w.mon,6));
    if(tw.length)out+=`• Tests: avg ${Math.round(tw.reduce((a,x)=>a+x.obtained/x.total,0)/tw.length*100)}%\n`;
    out+=`• Outstanding right now: ${outstandingItems().length} items\n\n`;
    const rec=[];
    if(w.total&&w.done/w.total<0.6)rec.push('Plan ~20% fewer daily tasks and protect completion rate.');
    if(outstandingItems().length>3)rec.push('Run the Catch-Up Plan to clear overdue work before adding anything new.');
    if(entries.length>1&&entries[entries.length-1][1]<entries[0][1]*0.3)rec.push(`${subjName(entries[entries.length-1][0])} is being neglected — give it one dedicated block next week.`);
    if(w.min<prev.min*0.7&&prev.min>0)rec.push('Study time dropped vs last week — set a fixed daily minimum and use Focus Mode to protect it.');
    if(!rec.length)rec.push('Solid week. Next week: keep the rhythm and add one spaced-revision pass on low-confidence topics.');
    out+='What to change next week:\n'+rec.map(r=>'• '+r).join('\n');
    return out;
  },
  /* chat router — intent matching on real data */
  async respond(text){
    const t=text.toLowerCase();
    const tryAPI=async prompt=>{if(!this.isConfigured())return null;try{return await this.callAPI(prompt);}catch(e){return '(API unreachable — offline assistant used your local data instead)\n\n';}};
    const m=[
      [/what should i (do|study)|next task|now\??$/,()=>this.localRecommend()],
      [/plan (for )?today|make.*(day|today)/,()=>this.localDailyPlan()],
      [/missed|behind|catch.?up|didn'?t finish|unfinished|reschedule/,()=>{const p=catchUpPlan();let o=p.items.length?`You have ${p.items.length} outstanding item(s). Recovery plan:\n\nToday (${fmtMin(p.capToday)}): ${p.today.length?p.today.map(i=>i.title).join('; '):'keep light'}\nTomorrow (${fmtMin(p.capTmr)}): ${p.tomorrow.length?p.tomorrow.map(i=>i.title).join('; '):'nothing forced'}\n${p.later.length?'Later: '+p.later.map(i=>i.title).join('; '):''}\n\nOpen the Outstanding Center to apply this plan with one tap.`:'Nothing is outstanding — you\'re fully caught up. Nice.';return o;}],
      [/exam.*plan|prepare.*exam|exam in/,()=>{const e=state.exams.slice().sort((a,b)=>a.date<b.date?-1:1).find(x=>x.date>=todayISO());return e?this.localExamPlan(e):'No exams saved yet. Add one in the Exams view and I\'ll build a day-by-day plan.';}],
      [/weak|struggl|bad at/,()=>{const w=weakTopics(6);return w.length?'Based on low confidence ratings, mistakes and skipped tasks, your weakest areas are:\n'+w.map(x=>'• '+x.name).join('\n')+'\n\nPick the top one for your next session — low-confidence topics get priority in revision scheduling.':'No clear weak spots yet. They\'ll appear here as you log tests, mistakes and confidence ratings.';}],
      [/revise|revision/,()=>{const r=revisionsDue();return r.length?'Due for revision today:\n'+r.map(x=>`• ${subjName(x.subjectId)} — ${x.topic} (confidence: ${confLabel(x.confidence)})`).join('\n')+'\n\nFind them in the Revision view with one-tap review.':'No revisions due today. New ones are scheduled automatically when you complete topics.';}],
      [/how much.*studied|study (this|last) (week|time)|hours/,()=>{const w=weekTotals();return `This week: ${fmtMin(w.min)} across ${state.sessions.filter(s=>s.date>=w.mon).length} sessions (daily avg ${fmtMin(w.min/7)}). Today so far: ${fmtMin(minutesOn(todayISO()))}. All-time: ${fmtMin(state.sessions.reduce((a,s)=>a+s.duration,0))}.`;}],
      [/why.*progress low|improve|better/,()=>this.localProgressAnalysis()],
      [/test me|quiz|practice question/,()=>this.localQuiz(extractTopic(text))],
      [/flashcard/,()=>this.localFlashcards(extractTopic(text))],
      [/explain|how do i (study|learn)/,()=>this.localExplain(extractTopic(text))],
      [/mistake/,()=>this.localMistakeAnalysis()],
      [/week.*review|review.*week/,()=>this.localWeeklyReview()],
      [/3[- ]?hour|focused (study )?plan/,()=>`A 3-hour focused block, structured:\n\n• 0:00–0:50 — Hardest task first (${allOpenTasks()[0]?subjName(allOpenTasks()[0].subjectId)+' — '+allOpenTasks()[0].title:'your top priority'})\n• 0:50–1:00 — Break, move around\n• 1:00–1:45 — Second task or practice problems\n• 1:45–1:55 — Break\n• 1:55–2:40 — Revision of today's due topics\n• 2:40–3:00 — Quick recap + plan tomorrow\n\nUse Focus Mode with 50-minute timers.`],
    ];
    for(const[re,fn]of m){if(re.test(t)){const local=await fn();const pre=await tryAPI(text);return (pre||'')+local;}}
    const pre=await tryAPI(text);
    if(pre)return pre;
    return `I'm running in offline mode using your local data — I can help with: "what should I study now", "plan my day", "I'm behind", "which subjects am I weak in", "what should I revise", "how much did I study this week", exam plans, quizzes, flashcards and weekly reviews.\n\nYou asked: "${text}"\n\nTip: connect your own AI API in Settings → AI Assistant for open-ended answers (your key stays in this browser).`;
  }
};
const fmtHM=m=>pad(Math.floor(m/60))+':'+pad(m%60);
function extractTopic(text){const m2=text.match(/(?:on|about|topic|explain|quiz me on|test me on)\s+(.+)/i);return m2?m2[1].replace(/[?.!]+$/,''):(allOpenTasks()[0]?.topic||allOpenTasks()[0]?.title||'your current topic');}

/* ════════════════════════════ 8. NOTIFICATIONS ════════════════════════════ */
function pushNotif(title,body,icon='bell',key=null){
  const today=todayISO();
  if(key){const k=key+':'+today;if(state.meta.notSent[k])return;state.meta.notSent[k]=1;save();}
  const n={id:uid(),title,body,icon,when:Date.now(),read:false};
  state.notifications.unshift(n);
  if(state.notifications.length>60)state.notifications.length=60;
  save();updateBell();
  const quiet=state.settings.quiet&&inQuietHours();
  if(!quiet){toast(title,'info');beep();browserNotify(title,body);}
}
function inQuietHours(){
  const c=nowMin(),a=toMin(state.settings.quietStart),b=toMin(state.settings.quietEnd);
  return a<b?(c>=a&&c<b):(c>=a||c<b);
}
function browserNotify(title,body){
  if(state.settings.browserNotif&&'Notification'in window&&Notification.permission==='granted'){
    try{new Notification(title,{body});}catch(e){}
  }
}
let AC=null;
function beep(){
  if(!state.settings.sound)return;
  try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();
    [[880,0],[1175,.18]].forEach(([f,d])=>{const o=AC.createOscillator(),g=AC.createGain();o.connect(g);g.connect(AC.destination);
    o.frequency.value=f;g.gain.setValueAtTime(.001,AC.currentTime+d);g.gain.exponentialRampToValueAtTime(.07,AC.currentTime+d+.02);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d+.25);
    o.start(AC.currentTime+d);o.stop(AC.currentTime+d+.3);});
  }catch(e){}
}
setInterval(()=>{ // smart checks — deduped per day via notifSent keys, no spam
  if(!state||!state.user.onboarded)return;
  const t=todayISO();
  // session starting in ~10 min
  routineFor(t).forEach(b=>{
    if(!['study','class'].includes(b.category))return;
    const s=toMin(b.start);if(s-nowMin()===10||s-nowMin()===9)pushNotif(`${b.title} starts in 10 minutes`,b.subjectId?subjName(b.subjectId):'Scheduled block','clock','blk'+b.id);
  });
  // revision due (morning once)
  if(nowMin()>=8*60&&revisionsDue().length)pushNotif('Revision due today',revisionsDue().length+' topic(s) awaiting review','repeat','revdue');
  // assignment deadline <24h
  state.assignments.forEach(a=>{if(a.due&&!a.notified&&a.progress<100&&daysBetween(t,a.due)===0&&a.due>=t)pushNotif('Assignment due today',a.title,'assign','asg'+a.id);});
  // exam <3 days
  state.exams.forEach(e=>{if(e.date>=t&&daysBetween(t,e.date)<=3&&daysBetween(t,e.date)>=0)pushNotif('Exam approaching',`${e.name} in ${daysBetween(t,e.date)} day(s)`,'exam','exm'+e.id);});
  // streak at risk
  if(nowMin()>=18*60&&minutesOn(t)===0&&streak()>0)pushNotif('Your streak is at risk',`No study time logged today — ${streak()} day streak on the line`,'flame','streak');
  // outstanding reminder
  const od=outstandingItems().length;
  if(nowMin()>=10*60&&od>0)pushNotif('Outstanding work',od+' unfinished item(s) carried over','out','outc');
},45000);
function updateBell(){
  const un=state.notifications.filter(n=>!n.read).length;
  const d=$('#bellDot');d.style.display=un?'grid':'none';d.textContent=un>9?'9+':un;
}
function renderNotifPanel(){
  const p=$('#npanel');
  p.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;padding:13px 16px;border-bottom:1px solid var(--line)"><h3 style="font-size:15px">Notifications</h3><button class="btn ghost sm" data-act="clearNotifs">Clear all</button></div>`+
  (state.notifications.length?state.notifications.map(n=>`<div class="nitem ${n.read?'':'unread'}"><div class="ni" style="background:var(--accent-soft);color:var(--accent)">${I(n.icon||'bell',15)}</div><div><div>${esc(n.title)}</div><div style="color:var(--ink2)">${esc(n.body)}</div><div class="when">${timeAgo(n.when)}</div></div></div>`).join(''):'<div class="empty">'+I('bell',28)+'<br>No notifications yet</div>');
}
function timeAgo(ts){const s=Math.floor((Date.now()-ts)/1000);if(s<60)return'just now';if(s<3600)return Math.floor(s/60)+'m ago';if(s<86400)return Math.floor(s/3600)+'h ago';return Math.floor(s/86400)+'d ago';}

/* ---------- CALENDAR ---------- */
let calMode='month',calAnchor=todayISO();
Views.calendar=function(){
  const anchor=pd(calAnchor);
  const monthName=anchor.toLocaleDateString(undefined,{month:'long',year:'numeric'});
  let body='';
  const eventsFor=iso=>{
    const ev=[];
    state.tasks.forEach(x=>{if(x.date===iso||x.deadline===iso)ev.push({t:x.title,type:'task',color:subjColor(x.subjectId),obj:x,kind:'Task',when:x.date===iso?'planned':'deadline',st:x.status});});
    state.assignments.forEach(a=>{if(a.due===iso)ev.push({t:a.title,type:'assign',color:'var(--amber)',obj:a,kind:'Assignment'});});
    state.exams.forEach(e=>{if(e.date===iso)ev.push({t:e.name,type:'exam',color:'var(--danger)',obj:e,kind:'Exam'});});
    state.revisions.forEach(r=>{if(r.due===iso)ev.push({t:'Revise: '+r.topic,type:'rev',color:subjColor(r.subjectId),obj:r,kind:'Revision'});});
    sessionsOn(iso).forEach(s=>ev.push({t:'Studied: '+(s.topic||subjName(s.subjectId)),type:'sess',color:'var(--accent)',obj:s,kind:'Session ('+fmtMin(s.duration)+')'}));
    return ev;
  };
  if(calMode==='month'){
    const y=anchor.getFullYear(),m2=anchor.getMonth();
    const first=new Date(y,m2,1),start=(first.getDay()+6)%7; // Monday-first
    const dim=new Date(y,m2+1,0).getDate(),dimPrev=new Date(y,m2,0).getDate();
    let cells='';
    for(let i=0;i<42;i++){
      const dn=i-start+1;let iso,cls='cal-cell',out=false;
      if(dn<1){iso=addDays(`${y}-${pad(m2+1)}-01`,dn-dimPrev);out=true;}
      else if(dn>dim){iso=addDays(`${y}-${pad(m2+1)}-${pad(dim)}`,dn-dim);out=true;}
      else iso=`${y}-${pad(m2+1)}-${pad(dn)}`;
      if(out)cls+=' out';if(iso===todayISO())cls+=' today';
      const ev=eventsFor(iso);
      cells+=`<div class="${cls}" data-act="calDay:${iso}" role="button" tabindex="0"><div class="d num">${dn<1?dimPrev+dn:dn>dim?dn-dim:dn}</div><div class="cal-dots">${ev.slice(0,6).map(e=>`<i style="background:${e.color}"></i>`).join('')}</div></div>`;
    }
    body=`<div class="cal-grid">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>`<div class="cal-dow">${d}</div>`).join('')}${cells}</div>`;
  }else if(calMode==='week'){
    const dow=(anchor.getDay()+6)%7,mon=addDays(calAnchor,-dow);
    body=`<div class="week-grid">${[0,1,2,3,4,5,6].map(i=>{const iso=addDays(mon,i);const ev=eventsFor(iso);
      return `<div class="week-col ${iso===todayISO()?'today':''}"><div class="wh">${WEEKDAYS[pd(iso).getDay()]} ${pd(iso).getDate()}</div>
      ${ev.length?ev.map(e=>`<div class="cal-ev" data-act="calEv:${e.type}:${e.obj.id}"><i class="subj-dot" style="background:${e.color}"></i><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(e.t)}</span></div>`).join(''):'<div style="font-size:11.5px;color:var(--ink3);text-align:center;padding:8px 0">—</div>'}</div>`;}).join('')}</div>`;
  }else{
    const ev=eventsFor(calAnchor),blocks=routineFor(calAnchor);
    body=`<div class="grid" style="grid-template-columns:1fr 1fr;align-items:start">
      <div class="card"><div class="card-h"><h3>Events</h3></div><div class="card-b" style="padding-top:4px">${ev.length?ev.map(e=>`<div class="cal-ev" data-act="calEv:${e.type}:${e.obj.id}"><i class="subj-dot" style="background:${e.color}"></i><span>${esc(e.t)}</span><span class="badge b-mut" style="margin-left:auto">${e.kind}</span></div>`).join(''):'<div class="empty">No events</div>'}</div></div>
      <div class="card"><div class="card-h"><h3>Routine</h3></div><div class="card-b" style="padding-top:4px">${blocks.length?blocks.map(b=>`<div class="row-item"><div class="grow"><div class="t num">${b.start}–${b.end} ${esc(b.title)}</div></div><span class="chip" style="color:${CAT_COLORS[b.category]}">${esc(b.category)}</span></div>`).join(''):'<div class="empty">No blocks</div>'}</div></div></div>`;
  }
  return `
  <div class="page-head"><div><h2>Academic Calendar</h2><p>Tasks, sessions, assignments, exams, revisions and deadlines in one place.</p></div></div>
  <div class="cal-head">
    <button class="icon-btn" data-act="calNav:-1" aria-label="Previous">${I('chevL')}</button>
    <strong style="min-width:150px;text-align:center;font-family:var(--fd);font-size:16px">${calMode==='month'?monthName:fmtDate(calAnchor)+(calMode==='week'?' · week':'')}</strong>
    <button class="icon-btn" data-act="calNav:1" aria-label="Next">${I('chevR')}</button>
    <button class="btn sm" data-act="calToday">Today</button>
    <div class="tabs" style="margin-left:auto">${['day','week','month'].map(m2=>`<button data-act="calMode:${m2}" class="${calMode===m2?'on':''}">${m2[0].toUpperCase()+m2.slice(1)}</button>`).join('')}</div>
  </div>${body}
  <style>@media(max-width:900px){.cal-cell{min-height:56px;padding:4px}}</style>`;
};
function calEventModal(type,id){
  const map={task:[state.tasks,'editTask'],assign:[state.assignments,'editAssign'],exam:[state.exams,null],rev:[state.revisions,null],sess:[state.sessions,null]};
  const[list]=map[type]||[[]];const o=list.find(x=>x.id===id);
  if(!o){toast('Item no longer exists','warn');return;}
  const rows=[['Title',o.title||o.name||o.topic],['Subject',subjName(o.subjectId)],['Date',o.date||o.due||o.start?fmtDate(o.date||o.due):(o.start||'')]];
  if(o.status)rows.push(['Status',o.status]);
  if(o.duration)rows.push(['Duration',fmtMin(o.duration)]);
  if(o.focus)rows.push(['Focus rating',o.focus+'/5']);
  if(o.prep!==undefined)rows.push(['Preparation',o.prep+'%']);
  if(o.confidence)rows.push(['Confidence',confLabel(o.confidence)]);

        <div class="fld"><label>Topic (optional)</label><input id="fTopic" value="${esc(F.topic||'')}" placeholder="e.g. Eigenvalues"></div>

    </div></div>
  </div>`;

const Focus={mode:'pomodoro',customMin:50,remaining:25*60,total:25*60,running:false,paused:false,onBreak:false,subjectId:null,topic:'',notes:'',timer:null,
  start(){this.total=this.remaining=this.mode==='pomodoro'?state.settings.focusMin*60:this.customMin*60;this.running=true;this.paused=false;this.tickSetup();render();},
  tickSetup(){clearInterval(this.timer);this.timer=setInterval(()=>{if(this.running&&!this.paused){this.remaining--;document.title=fmtClock(this.remaining)+' · StudyOS';
    const tv=$('#fTime');if(tv){tv.textContent=fmtClock(this.remaining);const rc=$('#fRing');rc&&ringChart(rc,100-(this.remaining/this.total*100));}
    if(this.remaining<=0){clearInterval(this.timer);
      if(!this.onBreak&&this.mode==='pomodoro'){this.onBreak=true;this.total=this.remaining=state.settings.breakMin*60;beep();toast('Focus block done — take your break','ok');render();this.tickSetup();}
      else this.finish(true);}
  }},1000);},
  toggle(){if(!this.running){this.start();return;}this.paused=!this.paused;render();},
  reset(){clearInterval(this.timer);this.running=false;this.paused=false;this.onBreak=false;document.title='AI StudyOS — Personal Study Assistant';this.remaining=this.mode==='pomodoro'?state.settings.focusMin*60:this.customMin*60;this.total=this.remaining;render();},
  finish(auto){
    clearInterval(this.timer);const planned=Math.round(this.total/60);
    const actual=Math.round((this.total-this.remaining)/60);
    const subjectId=($('#fSubj')||{}).value||this.subjectId||state.subjects[0]?.id||null;
    const topic=($('#fTopic')||{}).value||this.topic;
    const notes=($('#fNotes')||{}).value||this.notes;
    this.running=false;this.paused=false;this.onBreak=false;document.title='AI StudyOS — Personal Study Assistant';
    if(actual<1&&!auto){this.reset();return;}
    formModal(auto?'Session complete':'Finish session',[
      {k:'subjectId',label:'Subject',t:'select',o:state.subjects.map(s=>({v:s.id,l:s.name})),val:subjectId},
      {k:'topic',label:'Topic',val:topic,half:true},
      {k:'focus',label:'How focused were you? (1–5)',t:'range',min:1,max:5,val:3,half:true},
      {k:'notes',label:'Session notes',t:'textarea',val:notes,hint:`Planned ${planned} min · actual ${actual} min (${pct(actual,planned)}% completion)`}
    ],(v,m)=>{
      state.sessions.push({id:uid(),date:todayISO(),start:nowHM(),duration:actual,planned,completion:pct(actual,planned),focus:v.focus,...v});
      const s=subj(v.subjectId);if(s)s.hours=(s.hours||0)+actual;
      save();m.close();render();toast(`Session logged: ${fmtMin(actual)} of ${subjName(v.subjectId)}`,'ok');
    },'Log session');
  }
};
function fmtClock(s){return pad(Math.floor(s/60))+':'+pad(s%60);}

Views.assistant=function(){

      ${state.aiChats.length?state.aiChats.map(m2=>`<div class="msg ${m2.role==='user'?'user':'ai'}">${esc(m2.text)}${m2.role!=='user'?'<span class="src">AI StudyOS · offline coach, based on your local data</span>':''}</div>`).join('')
      :`<div class="msg ai">Hi ${esc(state.user.name||'there')} — I'm your study coach. I read your tasks, sessions, revisions, exams and tests, then give grounded advice. Try a suggestion below, or ask anything.</div>`}
    </div>
    <div class="chips">${chips.map(c=>`<button data-act="chip" data-q="${esc(c)}">${esc(c)}</button>`).join('')}</div>
    <div class="chat-in"><input id="chatIn" placeholder="Ask your study coach…"><button class="btn pri" data-act="chatSend" id="chatSendBtn">${I('send')} Send</button></div>
  </div></div>`;
};
async function sendChat(text){
  if(!text.trim()||chatBusy)return;
  chatBusy=true;
  state.aiChats.push({role:'user',text,when:Date.now()});
  renderChat();save();
  const log=$('#chatLog');log.scrollTop=log.scrollHeight;
  const thinking=modal('','<div style="padding:6px 2px;color:var(--ink3);font-size:13.5px">Thinking through your data…</div>',null,{static:true});
  let reply;
  try{reply=await AIService.respond(text);}
  catch(e){reply='Something went wrong while reasoning — please try again.';}
  thinking.close();
  state.aiChats.push({role:'ai',text:reply,when:Date.now()});
  if(state.aiChats.length>80)state.aiChats.splice(0,state.aiChats.length-80);
  save();renderChat();chatBusy=false;
}
function renderChat(){
  const log=$('#chatLog');if(!log)return;
  log.innerHTML=state.aiChats.map(m2=>`<div class="msg ${m2.role==='user'?'user':'ai'}">${esc(m2.text)}${m2.role!=='user'?'<span class="src">AI StudyOS · based on your local data</span>':''}</div>`).join('');
  log.scrollTop=log.scrollHeight;
}

  <div class="card"><div class="card-h"><h3>Notifications</h3></div><div class="card-b">
    <label style="display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer"><span>Sound</span><input type="checkbox" ${s.sound?'checked':''} data-act="setSound" style="width:auto;accent-color:var(--accent)"></label>
