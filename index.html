  </div></div>
  <div class="card"><div class="card-h"><h3>AI assistant</h3><span class="badge ${AIService.isConfigured()?'b-ok':'b-mut'}">${AIService.isConfigured()?'API connected':'offline mode'}</span></div><div class="card-b">
    <p style="font-size:13px;color:var(--ink2);margin-bottom:10px">Without an API, the offline coach answers using your real local data. Connecting an API is <strong>optional</strong> — requests go directly from your browser to the provider; your key is stored only in this browser and never sent anywhere else.</p>
    <label style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;cursor:pointer"><span>Enable external AI API</span><input type="checkbox" ${state.aiConfig.enabled?'checked':''} data-act="setAI" style="width:auto;accent-color:var(--accent)"></label>
    <div class="frow"><div class="fld"><label>Base URL (OpenAI-compatible)</label><input id="aiUrl" value="${esc(state.aiConfig.baseUrl)}" placeholder="https://api.openai.com/v1"></div>
    <div class="fld"><label>Model</label><input id="aiModel" value="${esc(state.aiConfig.model)}" placeholder="gpt-4o-mini"></div></div>
    <div class="fld"><label>API key</label><input id="aiKey" type="password" value="${esc(state.aiConfig.key)}" placeholder="sk-…"></div>
    <button class="btn pri" data-act="saveAI">${I('check')} Save AI config</button>
  </div></div>
  <div class="card"><div class="card-h"><h3>Data — backup &amp; restore</h3></div><div class="card-b">
    <p style="font-size:13px;color:var(--ink2);margin-bottom:12px">Everything autosaves to IndexedDB (with a localStorage mirror) after every change. Export creates a full JSON backup.</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn pri" data-act="export">${I('dl')} Backup data</button>
      <button class="btn" data-act="import">${I('ul')} Restore data</button>
      <button class="btn" data-act="sample">${I('run')} Load sample data</button>
      <button class="btn danger" data-act="reset">${I('trash')} Reset everything</button>
    </div>
    <div class="hint" style="margin-top:10px">Owner mode: you already have full control — export, restore, and reset are the advanced data operations.</div>
  </div></div>
  <div class="card"><div class="card-h"><h3>About your data</h3></div><div class="card-b" style="font-size:13.5px;color:var(--ink2)">
    🔒→ ${I('check',14)} Your study data is stored <strong>locally on this device</strong>. Nothing is sent anywhere unless you personally enable and configure an external AI API above.
  </div></div>
  </div>`;
};

/* ════════════════════════════ 10. ACTIONS ════════════════════════════ */
const Actions={
  nav:k=>{currentView=k;render();closeSidebar();},
  openSidebar(){ $('#sidebar').classList.add('open');$('#scrim').classList.add('open');},
  closeSidebar(){$('#sidebar').classList.remove('open');$('#scrim').classList.remove('open');},
  toggleTheme(){state.settings.theme=state.settings.theme==='light'?'dark':'light';applyTheme();save();render();},
  toggleNotifPanel(){const p=$('#npanel');const open=p.classList.toggle('open');if(open){state.notifications.forEach(n=>n.read=true);save();renderNotifPanel();updateBell();}},
  clearNotifs(){state.notifications=[];save();renderNotifPanel();updateBell();},
  // tasks
  addTask(){ if(!state.subjects.length){toast('Add a subject first','warn');return subjectForm();} taskForm();},
  editTask(id){const t=state.tasks.find(x=>x.id===id);if(t)taskForm(t);else calEventModal('task',id);},
  completeTask(id){
    const t=state.tasks.find(x=>x.id===id);if(!t)return;
    if(t.status==='Completed'){t.status='Not Started';save();render();return;}
    t.status='Completed';t.actual=t.actual||t.est||45;save();render();
    toast(`Task completed — nice work`,'ok');
    if(t.topic&&t.subjectId){
      formModal('How confident are you?',[{k:'c',label:'Confidence for "'+t.topic+'" (1 = lost, 5 = strong) — this sets your next revision date',t:'range',min:1,max:5,val:3,half:false}],
      (v,m)=>{scheduleRevision(t.subjectId,t.topic,v.c);m.close();toast(`Revision scheduled in ${REV_INTERVALS[v.c-1]} days`,'ok');},'Schedule revision');
    }
  },
  // routine
  addRoutine(){routineForm();},
  editRoutine(id){const b=state.routine.find(x=>x.id===id);if(b)routineForm(b);},
  delRoutine(id){confirmModal('Delete this routine block?',()=>{state.routine=state.routine.filter(x=>x.id!==id);save();render();toast('Routine block deleted','ok');},{label:'Delete'});},
  rday:d=>{Views.routine._day=Number(d);render();},
  logMissed(id){const b=state.routine.find(x=>x.id===id);if(!b)return;
    formModal('Log catch-up session',[{k:'duration',label:'Minutes studied (or planned)',t:'number',min:5,val:Math.min(60,toMin(b.end)-toMin(b.start)),half:false}],(v,m)=>{
      state.sessions.push({id:uid(),date:todayISO(),start:nowHM(),duration:v.duration,planned:v.duration,completion:100,focus:3,subjectId:b.subjectId,topic:b.title,notes:'Catch-up for missed routine block'});
      const s=subj(b.subjectId);if(s)s.hours=(s.hours||0)+v.duration;
      save();m.close();render();toast('Catch-up session logged','ok');});},
  // outstanding
  reschedToday(kind,id){Actions._resched(kind,id,todayISO());},
  reschedTmr(kind,id){Actions._resched(kind,id,addDays(todayISO(),1));},
  _resched(kind,id,date){
    if(kind==='Task'){const t=state.tasks.find(x=>x.id===id);if(t){t.date=date;save();render();toast('Moved to '+fmtDate(date),'ok');}}
    else if(kind==='Revision'){const r=state.revisions.find(x=>x.id===id);if(r){r.due=date;save();render();toast('Revision moved','ok');}}
    else if(kind==='Assignment'){toast('Assignments keep their real submission date — plan a work task instead','warn');}
  },
  focusOn(kind,id){
    if(kind==='Task'){const t=state.tasks.find(x=>x.id===id);if(t){Focus.subjectId=t.subjectId;Focus.topic=t.topic||t.title;}}
    if(kind==='Revision'){const r=state.revisions.find(x=>x.id===id);if(r){Focus.subjectId=r.subjectId;Focus.topic=r.topic;}}
    currentView='focus';Actions._autoStart=true;render();Focus.start();
  },
  catchUp(){
    const p=catchUpPlan();
    const html=`<div style="font-size:13.5px">
      <strong>Today</strong> — ${fmtMin(p.capToday)} planned${p.today.length?':<ul style="margin:6px 0 12px 18px">'+p.today.map(i=>`<li>${esc(i.title)} <span class="badge b-mut">${fmtMin(i.est)}</span></li>`).join('')+'</ul>':' — keep it light.'}
      <strong>Tomorrow</strong> — ${fmtMin(p.capTmr)} planned${p.tomorrow.length?':<ul style="margin:6px 0 12px 18px">'+p.tomorrow.map(i=>`<li>${esc(i.title)} <span class="badge b-mut">${fmtMin(i.est)}</span></li>`).join('')+'</ul>':'. Nothing forced.'}
      ${p.later.length?`<strong>Can wait</strong> — ${p.later.map(i=>esc(i.title)).join(', ')}`:''}
      <p class="hint" style="margin-top:10px">Applying moves each item's planned date (nothing is deleted or permanently changed). The plan stays realistic — never more than your daily target.</p></div>`;
    const m=modal('Your catch-up plan',html,`<button class="btn ghost" data-n>Not now</button><button class="btn pri" data-y>${I('check')} Apply plan</button>`);
    m.el.querySelector('[data-n]').onclick=m.close;
    m.el.querySelector('[data-y]').onclick=()=>{
      p.today.forEach(i=>{if(i.obj.date)i.obj.date=todayISO();});
      p.tomorrow.forEach(i=>{if(i.obj.date)i.obj.date=addDays(todayISO(),1);});
      save();m.close();render();toast('Catch-up plan applied','ok');
    };
  },
  whatNow(){
    const r=recommendNow();
    if(!r){infoModal('Recommended now',`<p>Your board is clear. Options: start an optional practice session, get ahead on an upcoming deadline, or rest deliberately — rest is part of the plan.</p>`);return;}
    modal('Recommended now',`
      <div style="font-size:19px;font-weight:700;font-family:var(--fd)">${esc(subjName(r.subject))} — ${esc(r.title)}</div>
      <div style="display:flex;gap:7px;margin:12px 0;flex-wrap:wrap">
        <span class="chip">${I('clock',11)} ${r.min} minutes</span>
        ${r.why.some(w2=>/overdue|due today|exam|low/.test(w2))?'<span class="badge b-danger">High priority</span>':'<span class="badge b-warn">Medium</span>'}
        ${r.targetLeft>0?`<span class="chip">${I('flame',11)} ${fmtMin(r.targetLeft)} of target left</span>`:''}
      </div>
      <div style="font-size:13.5px;color:var(--ink2)"><strong>Why:</strong> this topic is ${r.why.join(' and ')||'the best fit for your remaining time'}.</div>`,
      `<button class="btn ghost" data-n>Later</button><button class="btn pri" data-y>${I('play')} Start Now</button>`);
    const mm=modalStack[modalStack.length-1];
    mm.el.querySelector('[data-n]').onclick=mm.close;
    mm.el.querySelector('[data-y]').onclick=()=>{mm.close();Actions.focusOn(r.kind,r.obj.id);};
  },
  startNow(){const r=recommendNow();if(r)Actions.focusOn(r.kind,r.obj.id);},
  startFocus(){currentView='focus';render();},
  addSession(){ // quick manual log
    formModal('Log a study session',[
      {k:'subjectId',label:'Subject',t:'select',o:state.subjects.map(s=>({v:s.id,l:s.name}))},
      {k:'topic',label:'Topic',half:true},{k:'duration',label:'Minutes',t:'number',min:1,val:30,half:true},
      {k:'focus',label:'Focus rating 1–5',t:'range',min:1,max:5,val:3,half:false},
      {k:'notes',label:'Notes',t:'textarea'}
    ],(v,m)=>{state.sessions.push({id:uid(),date:todayISO(),start:nowHM(),planned:v.duration,completion:100,...v});
      const s=subj(v.subjectId);if(s)s.hours=(s.hours||0)+v.duration;
      save();m.close();render();toast(`Logged ${fmtMin(v.duration)}`,'ok');},'Log session');
  },
  // subjects
  addSubject(){subjectForm();},
  editSubject(id){const s=subj(id);if(s)subjectForm(s);},
  delSubject(id){confirmModal(`Delete <strong>${esc(subjName(id))}</strong> and all its chapters/topics? Sessions, tasks and revisions keep their records but lose the link.`,()=>{
    state.subjects=state.subjects.filter(x=>x.id!==id);save();render();toast('Subject deleted','ok');},{label:'Delete'});},
  toggleCh(sid,cid){const k=sid+':'+cid;Views.subjects._open=Views.subjects._open===k?null:k;render();},
  addChapter(sid){formModal('New chapter',[{k:'name',label:'Chapter name',req:true}],(v,m)=>{subj(sid).chapters.push({id:uid(),name:v.name,topics:[]});save();m.close();render();},'Add chapter');},
  addTopic(arg){const[sid,cid]=arg.split(':');
    formModal('New topic',[{k:'name',label:'Topic name',req:true}],(v,m)=>{
      subj(sid).chapters.find(c=>c.id===cid).topics.push({id:uid(),name:v.name,done:false});
      save();m.close();Views.subjects._open=sid+':'+cid;render();},'Add topic');},
  subjAddTopicQuick(sid){
    const s=subj(sid);
    formModal('Quick add — '+s.name,[
      {k:'chapter',label:'Chapter',req:true,val:s.chapters[0]?.name||''},
      {k:'topics',label:'Topics (one per line)',t:'textarea',req:true}
    ],(v,m)=>{
      let c=s.chapters.find(c2=>c2.name.toLowerCase()===v.chapter.toLowerCase());
      if(!c){c={id:uid(),name:v.chapter,topics:[]};s.chapters.push(c);}
      v.topics.split('\n').map(x=>x.trim()).filter(Boolean).forEach(t=>c.topics.push({id:uid(),name:t,done:false}));
      save();m.close();render();toast('Topics added','ok');
    });
  },
  topicDone(arg){const[sid,cid,tid]=arg.split(':');const s=subj(sid),c=s.chapters.find(x=>x.id===cid),t=c.topics.find(x=>x.id===tid);
    if(t.done){t.done=false;save();render();return;}
    formModal('Topic completed: '+t.name,[{k:'c',label:'Confidence 1–5 (drives revision spacing)',t:'range',min:1,max:5,val:3,half:false}],
      (v,m)=>{markTopicDone(s,c,t,v.c);m.close();render();toast(`Topic done — revision in ${REV_INTERVALS[v.c-1]} days`,'ok');},'Save');},
  delTopic(arg){const[sid,cid,tid]=arg.split(':');const c=subj(sid).chapters.find(x=>x.id===cid);
    c.topics=c.topics.filter(x=>x.id!==tid);save();render();},
  // exams
  addExam(){if(!state.subjects.length){toast('Add a subject first','warn');return subjectForm();}examForm();},
  editExam(id){const e=state.exams.find(x=>x.id===id);if(e)examForm(e);},
  delExam(id){confirmModal('Delete this exam?',()=>{state.exams=state.exams.filter(x=>x.id!==id);save();render();},{label:'Delete'});},
  examPlan(id){
    const e=state.exams.find(x=>x.id===id);if(!e)return;
    AIService.createExamPlan(e).then(text=>{
      const mm=modal('Exam plan — '+e.name,`<div style="font-size:13.5px;white-space:pre-wrap">${esc(text)}</div>`,
      `<button class="btn ghost" data-n>Close</button>${e.chapters?.length?`<button class="btn pri" data-y>${I('check')} Create prep tasks</button>`:''}`,);
      mm.el.querySelector('[data-n]').onclick=mm.close;
      const y=mm.el.querySelector('[data-y]');
      if(y)y.onclick=()=>{
        const t=todayISO(),days=Math.max(1,daysBetween(t,e.date));
        const perDay=Math.max(1,Math.ceil(e.chapters.length/Math.max(1,days-2)));
        let d=0;
        for(let i=0;i<e.chapters.length;i+=perDay){
          d++;state.tasks.push({id:uid(),title:`${e.name}: ${e.chapters.slice(i,i+perDay).join(', ')}`,subjectId:e.subjectId,date:addDays(t,d-1),deadline:e.date,priority:'high',est:60,type:'exam-prep',status:'Not Started'});
        }
        save();mm.close();currentView='planner';render();toast(`${d} prep tasks created`,'ok');
      };
    });
  },
  examAddTask(id){const e=state.exams.find(x=>x.id===id);
    taskForm({title:'Prepare: '+e.name,subjectId:e.subjectId,deadline:e.date,date:todayISO(),priority:'high',type:'exam-prep',est:60});},
  // assignments
  addAssign(){if(!state.subjects.length){toast('Add a subject first','warn');return subjectForm();}assignForm();},
  editAssign(id){const a=state.assignments.find(x=>x.id===id);if(a)assignForm(a);else calEventModal('assign',id);},
  delAssign(id){confirmModal('Delete this assignment?',()=>{state.assignments=state.assignments.filter(x=>x.id!==id);save();render();},{label:'Delete'});},
  assignProg(id){const a=state.assignments.find(x=>x.id===id);if(!a)return;
    formModal('Update progress — '+a.title,[{k:'progress',label:'Progress %',t:'range',min:0,max:100,val:a.progress||0,half:false}],(v,m)=>{a.progress=v.progress;if(v.progress>=100)a.progress=100;save();m.close();render();toast('Progress updated','ok');});},
  // focus
  fmode(m2){Focus.mode=m2;Focus.reset();},
  fToggle(){Focus.toggle();},
  fFinish(){Focus.finish(false);},
  fReset(){Focus.reset();},
  // revision
  doRevise(id){const r=state.revisions.find(x=>x.id===id);if(r)reviseModal(r);},
  addRevision(){
    formModal('Schedule revision',[
      {k:'subjectId',label:'Subject',t:'select',o:state.subjects.map(s=>({v:s.id,l:s.name}))},
      {k:'topic',label:'Topic',req:true,half:true},
      {k:'confidence',label:'Current confidence 1–5',t:'range',min:1,max:5,val:3,half:true}
    ],(v,m)=>{scheduleRevision(v.subjectId,v.topic,v.confidence);m.close();render();toast('Revision scheduled','ok');});
  },
  // notes
  addNote(){noteForm();},
  openNote(id){const n=state.notes.find(x=>x.id===id);if(!n)return;
    const m=modal(n.title,`<div style="font-size:14px;line-height:1.7">${renderRich(n.body)}</div>
      <div style="margin-top:14px;display:flex;gap:6px;flex-wrap:wrap">${n.subjectId?`<span class="badge b-mut">${esc(subjName(n.subjectId))}</span>`:''}${(n.tags||[]).map(t=>`<span class="badge b-acc">${esc(t)}</span>`).join('')}</div>`,
      `<button class="btn" data-e>${I('edit',13)} Edit</button>`);
    m.el.querySelector('[data-e]').onclick=()=>{m.close();noteForm(n);};},
  favNote(id){const n=state.notes.find(x=>x.id===id);n.fav=!n.fav;save();render();},
  // tests & mistakes
  addTest(){if(!state.subjects.length){toast('Add a subject first','warn');return subjectForm();}testForm();},
  editTest(id){const t=state.tests.find(x=>x.id===id);if(t)testForm(t);},
  delTest(id){confirmModal('Delete this test record?',()=>{state.tests=state.tests.filter(x=>x.id!==id);save();render();},{label:'Delete'});},
  addMistake(){if(!state.subjects.length){toast('Add a subject first','warn');return subjectForm();}mistakeForm();},
  editMistake(id){const m2=state.mistakes.find(x=>x.id===id);if(m2)mistakeForm(m2);},
  delMistake(id){confirmModal('Delete this mistake entry?',()=>{state.mistakes=state.mistakes.filter(x=>x.id!==id);save();render();},{label:'Delete'});},
  // goals & habits
  addGoal(){goalForm();},
  delGoal(id){confirmModal('Delete this goal?',()=>{state.goals=state.goals.filter(x=>x.id!==id);save();render();},{label:'Delete'});},
  addHabit(){formModal('New habit',[{k:'name',label:'Habit name',req:true,ph:'Daily revision'}],(v,m)=>{state.habits.push({id:uid(),name:v.name,log:{}});save();m.close();render();},'Add habit');},
  delHabit(id){confirmModal('Delete this habit?',()=>{state.habits=state.habits.filter(x=>x.id!==id);save();render();},{label:'Delete'});},
  habit(arg){const[id,d]=arg.split(':');const h=state.habits.find(x=>x.id===id);if(!h)return;
    if(h.log[d])delete h.log[d];else h.log[d]=true;save();render();},
  // assistant
  chip(el){sendChat(el.dataset.q);},
  async chatSend(){const inp=$('#chatIn');const v=inp.value;inp.value='';await sendChat(v);},
  async askAI(){currentView='assistant';render();setTimeout(()=>$('#chatIn')?.focus(),100);},
  weeklyReview(){AIService.reviewWeekly().then(t=>{const o=$('#wrOut');if(o){o.textContent=t;toast('Weekly review ready','ok');}});},
  // planner filter
  pfilter(k){plannerFilter=k;render();},
  // calendar
  calNav(dir){
    const d=pd(calAnchor);
    if(calMode==='month')d.setMonth(d.getMonth()+Number(dir));
    else if(calMode==='week')d.setDate(d.getDate()+7*Number(dir));
    else d.setDate(d.getDate()+Number(dir));
    calAnchor=dISO(d);render();
  },
  calToday(){calAnchor=todayISO();render();},
  calMode(m2){calMode=m2;render();},
  calDay(iso){calAnchor=iso;calMode='day';render();},
  calEv(arg){const[type,id]=arg.split(':');calEventModal(type,id);},
  // settings
  saveProfile(){
    state.user.name=$('#setName').value.trim();state.user.goal=$('#setGoal').value.trim();
    state.user.targetMin=Math.max(15,Number($('#setTarget').value)||180);
    state.settings.focusMin=Math.max(5,Number($('#setFocus').value)||25);
    state.user.wake=$('#setWake').value||'06:30';state.user.sleep=$('#setSleep').value||'23:00';
    saveNow();toast('Profile saved','ok');render();
  },
  setTheme(el){state.settings.theme=el.checked?'dark':'light';applyTheme();save();render();},
  setRM(el){state.settings.reduceMotion=el.checked;document.body.classList.toggle('rm',el.checked);save();},
  setSound(el){state.settings.sound=el.checked;save();if(el.checked)beep();},
  setBN(el){state.settings.browserNotif=el.checked;save();
    if(el.checked&&'Notification'in window&&Notification.permission==='default')Notification.requestPermission();},
  setQuiet(el){state.settings.quiet=el.checked;save();},
  saveQuiet(){state.settings.quietStart=$('#qStart').value||'22:30';state.settings.quietEnd=$('#qEnd').value||'07:30';save();toast('Quiet hours saved','ok');},
  setAI(el){state.aiConfig.enabled=el.checked;save();toast(el.checked?'API enabled — fill in the details below':'Using offline coach','ok');},
  saveAI(){
    state.aiConfig.baseUrl=$('#aiUrl').value.trim();state.aiConfig.key=$('#aiKey').value.trim();state.aiConfig.model=$('#aiModel').value.trim();
    saveNow();toast('AI config saved locally','ok');render();
  },
  export(){
    const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);
    a.download=`studyos-backup-${todayISO()}.json`;a.click();URL.revokeObjectURL(a.href);
    toast('Backup downloaded','ok');
  },
  import(){$('#importFile').click();},
  sample(){
    confirmModal('Load a small <strong>sample dataset</strong> (2 subjects, routine, tasks, sessions, tests)? Your current data will be <strong>replaced</strong>. Useful to explore the app.',()=>{
      state=sampleData();saveNow();applyTheme();render();toast('Sample data loaded — explore, then export/reset anytime','ok');
    },{label:'Load sample'});
  },
  reset(){
    confirmModal('This <strong>permanently deletes all</strong> StudyOS data on this device. Consider exporting a backup first.',()=>{
      confirmModal('Really delete everything? This cannot be undone.',()=>{
        state=freshState();saveNow();location.reload();
      },{label:'Yes, delete all'});
    },{label:'Reset app'});
  }
};
document.addEventListener('click',e=>{
  const a=e.target.closest('[data-act]');if(!a)return;
  if(a.tagName==='INPUT'&&a.type==='checkbox'&&a.dataset.act){
    const[k]=a.dataset.act.split(':');Actions[k]&&Actions[k](a);return;}
  e.preventDefault?.();
  const[fn,...rest]=a.dataset.act.split(':');
  if(Actions[fn])Actions[fn](rest.length?rest.join(':'):a,...rest);
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.id==='chatIn'){e.preventDefault();Actions.chatSend();}
  const cell=e.target.closest?.('.cal-cell');
  if(cell&&(e.key==='Enter'||e.key===' ')){e.preventDefault();cell.click();}
});

/* ════════════════════════════ 11. GLOBAL SEARCH ════════════════════════════ */
function globalSearch(q){
  const drop=$('#searchDrop');q=q.trim().toLowerCase();
  if(!q){drop.classList.remove('open');return;}
  const R=[];
  const push=(g,items)=>items.forEach(it=>R.push({g,...it}));
  push('Tasks',state.tasks.filter(x=>x.title.toLowerCase().includes(q)).slice(0,4).map(x=>({label:x.title,sub:fmtDate(x.date),go:()=>{currentView='planner';render();}})));
  push('Subjects',state.subjects.filter(x=>x.name.toLowerCase().includes(q)).slice(0,3).map(x=>({label:x.name,sub:subjectProgress(x)+'%',go:()=>{currentView='subjects';render();}})));
  push('Notes',state.notes.filter(x=>x.title.toLowerCase().includes(q)||x.body.toLowerCase().includes(q)).slice(0,4).map(x=>({label:x.title,sub:'note',go:()=>{currentView='notes';noteQ=x.title;render();Actions.openNote(x.id);}})));
  push('Exams',state.exams.filter(x=>x.name.toLowerCase().includes(q)).slice(0,3).map(x=>({label:x.name,sub:fmtDate(x.date),go:()=>{currentView='exams';render();}})));
  push('Assignments',state.assignments.filter(x=>x.title.toLowerCase().includes(q)).slice(0,3).map(x=>({label:x.title,sub:fmtDate(x.due),go:()=>{currentView='assignments';render();}})));
  push('Tests',state.tests.filter(x=>x.name.toLowerCase().includes(q)).slice(0,3).map(x=>({label:x.name,sub:fmtDate(x.date),go:()=>{currentView='tests';render();}})));
  push('Mistakes',state.mistakes.filter(x=>x.question.toLowerCase().includes(q)).slice(0,3).map(x=>({label:x.question.slice(0,44),sub:fmtDate(x.date),go:()=>{currentView='mistakes';render();}})));
  push('Goals',state.goals.filter(x=>x.title.toLowerCase().includes(q)).slice(0,3).map(x=>({label:x.title,sub:x.type,go:()=>{currentView='goals';render();}})));
  push('Revisions',state.revisions.filter(x=>x.topic.toLowerCase().includes(q)).slice(0,3).map(x=>({label:x.topic,sub:'rev '+fmtDate(x.due),go:()=>{currentView='revision';render();}})));
  drop.innerHTML=R.length?R.map((r,i)=>`<div class="sr-item" data-sr="${i}">${I('search',13)} <span>${esc(r.label)}</span><small>${esc(r.sub)}</small></div>`).join(''):'<div class="empty" style="padding:16px">No matches</div>';
  drop.classList.add('open');
  drop.querySelectorAll('[data-sr]').forEach(el=>el.onclick=()=>{drop.classList.remove('open');R[Number(el.dataset.sr)].go();});
}

/* ════════════════════════════ 12. ONBOARDING ════════════════════════════ */
function onboarding(){
  const back=document.createElement('div');back.className='mback';back.style.zIndex=300;
  back.innerHTML=`<div class="modal" style="max-width:600px"><div class="modal-h"><h3>Welcome to AI StudyOS</h3></div>
  <div class="modal-b">
    <div class="ob-progress"><i class="on"></i><i id="obP2"></i><i id="obP3"></i></div>
    <div class="ob-step on" data-s="1">
      <p style="margin-bottom:14px;color:var(--ink2);font-size:13.5px">Your personal study operating system. Everything stays on this device. Let's set up your profile.</p>
      <div class="fld"><label>Your name *</label><input id="obName" placeholder="Alex"></div>
      <div class="fld"><label>Main academic goal *</label><input id="obGoal" placeholder="Top 10% in finals / crack entrance exam…"></div>
      <div class="frow"><div class="fld"><label>Daily study hours available *</label><input type="number" id="obHours" min="1" max="16" value="3"></div>
      <div class="fld"><label>Subjects (comma separated) *</label><input id="obSubs" placeholder="Mathematics, Physics, History"></div></div>
    </div>
    <div class="ob-step" data-s="2">
      <p style="margin-bottom:14px;color:var(--ink2);font-size:13.5px">Your daily rhythm — I'll build a starter routine around it (fully editable later).</p>
      <div class="frow"><div class="fld"><label>Typical wake-up *</label><input type="time" id="obWake" value="06:30"></div>
      <div class="fld"><label>Typical sleep *</label><input type="time" id="obSleep" value="23:00"></div></div>
      <label style="display:flex;gap:9px;align-items:center;font-size:13.5px;cursor:pointer;margin-bottom:8px"><input type="checkbox" id="obClasses" checked style="width:auto"> I attend daytime classes/college (blocks 9:00–15:00 on weekdays)</label>
      <label style="display:flex;gap:9px;align-items:center;font-size:13.5px;cursor:pointer"><input type="checkbox" id="obEx" checked style="width:auto"> Include exercise &amp; meal blocks</label>
    </div>
    <div class="ob-step" data-s="3">
      <p style="margin-bottom:14px;color:var(--ink2);font-size:13.5px">Any exams coming up? I'll start a countdown and prep plan (you can skip).</p>
      <div class="frow"><div class="fld"><label>Exam name</label><input id="obExName" placeholder="Final Mathematics"></div>
      <div class="fld"><label>Exam date</label><input type="date" id="obExDate"></div></div>
      <div class="hint">That's it — your initial study plan generates automatically on the next step.</div>
    </div>
    <div class="ob-step" data-s="4" style="text-align:center;padding:20px 0">
      <div style="width:52px;height:52px;border-radius:16px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;margin:0 auto 14px">${I('check',24)}</div>
      <h3 style="font-size:20px;margin-bottom:8px" id="obDoneTitle">You're all set!</h3>
      <p id="obDone" style="color:var(--ink2);font-size:13.5px"></p>
    </div>
  </div>
  <div class="modal-f"><button class="btn ghost" id="obBack" style="display:none">Back</button><button class="btn pri" id="obNext">Continue</button></div></div>`;
  document.body.appendChild(back);
  let step=1;
  const show=()=>{back.querySelectorAll('.ob-step').forEach(s=>s.classList.toggle('on',Number(s.dataset.s)===step));
    back.querySelector('#obBack').style.display=step>1&&step<4?'':'none';
    back.querySelector('#obNext').textContent=step===3?'Generate my plan':step===4?'Open dashboard':'Continue';
    back.querySelector('#obP2').classList.toggle('on',step>=2);back.querySelector('#obP3').classList.toggle('on',step>=3);};
  back.querySelector('#obBack').onclick=()=>{step=Math.max(1,step-1);show();};
  back.querySelector('#obNext').onclick=()=>{
    if(step===1){
      if(!back.querySelector('#obName').value.trim()||!back.querySelector('#obSubs').value.trim()){toast('Please fill name and subjects','warn');return;}
      step=2;show();return;
    }
    if(step===2){step=3;show();return;}
    if(step===3){
      // generate everything from real inputs
      const name=back.querySelector('#obName').value.trim();
      state.user={name,goal:back.querySelector('#obGoal').value.trim(),
        targetMin:Math.max(60,Number(back.querySelector('#obHours').value)*60),onboarded:true,
        wake:back.querySelector('#obWake').value||'06:30',sleep:back.querySelector('#obSleep').value||'23:00'};
      back.querySelector('#obSubs').value.split(',').map(s=>s.trim()).filter(Boolean).forEach(n=>state.subjects.push(newSubject(n)));
      // routine skeleton
      const wake=toMin(state.user.wake),sleep=toMin(state.user.sleep);
      const add=(title,category,start,end,priority='medium',subjectId=null)=>{
        const days=[0,1,2,3,4,5,6];
        days.forEach(d=>state.routine.push({id:uid(),title,category,start:fmtHM(start),end:fmtHM(end),repeat:'weekly',days:[d],priority,subjectId,notes:''}));
      };
      if(back.querySelector('#obEx').checked){add('Wake up & morning routine','personal',wake,wake+30);add('Breakfast','meal',wake+30,wake+60);add('Exercise','exercise',wake+60,wake+90);}
      if(back.querySelector('#obClasses').checked)add('Classes / college','class',540,900,'high');
      if(back.querySelector('#obEx').checked)add('Lunch','meal',900,930);
      // distribute study blocks into free windows before sleep
      const target=state.user.targetMin;
      const blocksDesired=Math.min(3,Math.max(1,Math.round(target/75)));
      let start=back.querySelector('#obClasses').checked?1020:wake+120, cursor=start;
      for(let i=0;i<blocksDesired;i++){
        const dur=Math.min(90,Math.max(45,Math.round(target/blocksDesired)));
        if(cursor+dur+20>=sleep-30)break;
        add(i===0?'Deep study session':'Study session '+(i+1),'study',cursor,cursor+dur,'high',state.subjects[i%state.subjects.length]?.id||null);
        cursor+=dur+15;
      }
      add('Wind down & sleep prep','personal',Math.max(cursor+10,sleep-30),Math.min(sleep+0,1439));
      // exam
      const exName=back.querySelector('#obExName').value.trim(),exDate=back.querySelector('#obExDate').value;
      if(exName&&exDate)state.exams.push({id:uid(),name:exName,subjectId:state.subjects[0]?.id||null,date:exDate,importance:'high',prep:0,chapters:[]});
      // first goal
      state.goals.push({id:uid(),title:state.user.goal||'Build a consistent study habit',type:'academic',target:'Establish the daily routine',deadline:addDays(todayISO(),30),progress:0,milestones:[{text:'Complete 5 focus sessions',done:false},{text:'Log first test result',done:false}],status:'In Progress'});
      state.habits.push({id:uid(),name:'Daily study',log:{}});
      saveNow();
      const nBlocks=state.routine.filter(b=>b.category==='study').length/7;
      back.querySelector('#obDoneTitle').textContent=`Welcome, ${name}!`;
      back.querySelector('#obDone').innerHTML=`Generated: ${state.subjects.length} subjects · ${Math.round(nBlocks)} daily study block(s) (${fmtMin(target)}/day target)${exName?` · <strong>${esc(exName)}</strong> countdown started`:''}.<br>Everything is editable — check the Dashboard briefing to begin.`;
      step=4;show();
      back.querySelector('#obNext').onclick=()=>{back.remove();render();toast('Initial study plan ready','ok');};
    }
  };
}

/* ════════════════════════════ 14. BOOT ════════════════════════════ */
function applyTheme(){
  document.documentElement.dataset.theme=state.settings.theme;
  document.body.classList.toggle('rm',state.settings.reduceMotion);
  const tb=$('#themeBtn');tb.innerHTML=I(state.settings.theme==='light'?'moon':'sun',18);
  $('#userTag').textContent=state.user.name?state.user.name.toLowerCase()+' · study os':'personal assistant';
}
async function boot(){
  const loaded=await Store.load();
  state=loaded&&loaded.user?loaded:freshState();
  // migrate safety
  state.meta=state.meta||{created:todayISO(),notifSent:{},lastOpen:null};
  applyTheme();updateBell();
  $('#globalSearch').addEventListener('input',debounce(e=>globalSearch(e.target.value),140));
  document.addEventListener('click',e=>{if(!e.target.closest('.searchbox'))$('#searchDrop').classList.remove('open');});
  if(!e_algo_guard())return;
  if(!state.user.onboarded){render();onboarding();}
  else{render();
    // returning-user greeting logic
    if(state.meta.lastOpen&&state.meta.lastOpen!==todayISO()){
      const od=outstandingItems().length;
      if(od)setTimeout(()=>pushNotif('Welcome back','You have '+od+' outstanding item(s) from before','out',null),900);
    }
    state.meta.lastOpen=todayISO();save();
  }
  afterRenderBind();
  setInterval(()=>{const c=$('#clock');if(c)c.textContent=nowHM();if(currentView==='dash'){/* refresh now-line occasionally */}},30000);
  $('#clock').textContent=nowHM();
  window.addEventListener('resize',redrawCharts);
}
function e_algo_guard(){return true;}
function afterRenderBind(){
  // view-specific post-render hooks
  const origRender=render;
  render=function(){origRender();
    if(currentView==='dash')afterRenderDash();
    if(currentView==='focus')afterRenderFocus();
    if(currentView==='analytics')afterRenderAnalytics();
    if(currentView==='tests')afterRenderTests();
    if(currentView==='habits')afterRenderHabits();
    if(currentView==='notes'){const ns=$('#noteSearch');if(ns)ns.addEventListener('input',debounce(e=>{noteQ=e.target.value;const c=$('#main .view');c.innerHTML=Views.notes();const ns2=$('#noteSearch');ns2.focus();ns2.setSelectionRange(ns2.value.length,ns2.value.length);ns2.addEventListener('input',arguments.callee?undefined:undefined);},160));}
  };
}
boot();
