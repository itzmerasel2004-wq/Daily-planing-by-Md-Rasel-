<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2c6b4f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>AI StudyOS — Personal Study Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Instrument+Sans:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f1ea; --panel:#fdfcf8; --panel2:#ece8dd; --ink:#201f1a; --ink2:#5c5749; --ink3:#8f8a7a;
  --line:#e0dbcd; --line2:#d3cdbb; --accent:#2c6b4f; --accent-soft:#dfeae2; --accent-ink:#f2f7f3;
  --holo:#1f9e83; --holo-soft:rgba(31,158,131,.14);
  --amber:#a9752c; --amber-soft:#f3e8d3; --danger:#ac4638; --danger-soft:#f4e0dc; --info:#38607f; --info-soft:#dfe9f0;
  --ok:#2c6b4f; --ok-soft:#dfeae2;
  --sh:0 1px 2px rgba(32,31,26,.05),0 10px 30px -18px rgba(32,31,26,.25);
  --sh-lg:0 2px 6px rgba(32,31,26,.07),0 24px 60px -24px rgba(32,31,26,.35);
  --r:14px; --r-sm:9px;
  --fd:"Fraunces",Georgia,serif; --fs:"Instrument Sans","Noto Sans Bengali",-apple-system,sans-serif;
}
[data-theme="dark"]{
  --bg:#141612; --panel:#1b1e19; --panel2:#242821; --ink:#ece9dd; --ink2:#aaa898; --ink3:#7b796a;
  --line:#2b2f28; --line2:#383d33; --accent:#63a884; --accent-soft:#243529; --accent-ink:#0e130f;
  --holo:#3fd0af; --holo-soft:rgba(63,208,175,.12);
  --amber:#d0a04c; --amber-soft:#332b1c; --danger:#d3716a; --danger-soft:#37231f; --info:#7ba7c4; --info-soft:#1f2b33;
  --ok:#63a884; --ok-soft:#243529;
  --sh:0 1px 2px rgba(0,0,0,.3),0 10px 30px -18px rgba(0,0,0,.6);
  --sh-lg:0 2px 6px rgba(0,0,0,.35),0 24px 60px -24px rgba(0,0,0,.7);
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--fs);background:var(--bg);color:var(--ink);font-size:14.5px;line-height:1.5;overflow:hidden;height:100dvh}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:var(--line2);border-radius:9px}::-webkit-scrollbar-track{background:transparent}
h1,h2,h3,.serif{font-family:var(--fd);font-weight:600;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums}
body.rm *{transition:none!important;animation:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.app{display:grid;grid-template-columns:236px 1fr;grid-template-rows:58px 1fr;height:100dvh}
.sidebar{grid-row:1/3;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:14px 10px;overflow-y:auto;z-index:60}
.brand{display:flex;align-items:center;gap:10px;padding:6px 10px 16px}
.brand-mark{width:34px;height:34px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.brand h1{font-size:17px;line-height:1.1}
.brand small{display:block;font-family:var(--fs);font-weight:500;font-size:10.5px;color:var(--ink3);letter-spacing:.08em;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-label{font-size:10.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);padding:14px 12px 5px}
.nav button{display:flex;align-items:center;gap:11px;padding:8px 12px;border-radius:var(--r-sm);color:var(--ink2);font-weight:500;text-align:left;width:100%;transition:background .15s,color .15s;font-size:13px}
.nav button .bnl{display:block;font-size:10px;color:var(--ink3);font-weight:400;line-height:1.2}
.nav button.on .bnl{color:rgba(255,255,255,.75)}
.nav button:hover{background:var(--panel2);color:var(--ink)}
.nav button.on{background:var(--accent);color:var(--accent-ink);font-weight:600}
.nav button svg{width:16px;height:16px;flex:none}
.nav .badge{margin-left:auto;background:var(--danger);color:#fff;font-size:10.5px;font-weight:700;border-radius:99px;padding:1px 7px}
.nav button.on .badge{background:rgba(255,255,255,.28)}
.side-foot{margin-top:auto;padding:12px 6px 4px;border-top:1px solid var(--line);font-size:12px;color:var(--ink3)}
.side-foot .streak{display:flex;align-items:center;gap:8px;color:var(--ink2);font-weight:600;padding:6px 6px 10px}

.topbar{grid-column:2;display:flex;align-items:center;gap:12px;padding:0 18px;background:var(--bg);border-bottom:1px solid var(--line);z-index:40}
.topbar .clock{font-weight:600;font-size:14px;color:var(--ink2);white-space:nowrap}
.searchbox{position:relative;flex:1;max-width:460px}
.searchbox svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--ink3)}
.searchbox input{width:100%;padding:8px 12px 8px 34px;border:1px solid var(--line);border-radius:99px;background:var(--panel);font-size:13.5px}
.searchbox input:focus{border-color:var(--accent);outline:none}
.search-drop{position:absolute;top:calc(100% + 6px);left:0;right:0;max-height:60vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-lg);z-index:90;display:none}
.search-drop.open{display:block}
.sr-group{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--ink3);padding:9px 14px 3px}
.sr-item{display:flex;align-items:center;gap:9px;padding:8px 14px;cursor:pointer;font-size:13.5px}
.sr-item:hover{background:var(--panel2)}
.sr-item small{color:var(--ink3);margin-left:auto;flex:none}
.icon-btn{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:var(--ink2);position:relative;transition:background .15s}
.icon-btn:hover{background:var(--panel2)}
.icon-btn svg{width:18px;height:18px}
.icon-btn .dot{position:absolute;top:7px;right:7px;min-width:15px;height:15px;border-radius:99px;background:var(--danger);color:#fff;font-size:9.5px;font-weight:700;display:grid;place-items:center;padding:0 3px}
.burger{display:none}

main{grid-column:2;overflow-y:auto;padding:22px 24px 60px}
.view{max-width:1180px;margin:0 auto;animation:vin .25s ease}
@keyframes vin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.page-head h2{font-size:26px}
.page-head .bnh{font-family:"Noto Sans Bengali",var(--fs);font-size:13px;color:var(--ink3);font-weight:400}
.page-head p{color:var(--ink2);font-size:13.5px}
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 15px;border-radius:10px;font-weight:600;font-size:13.5px;border:1px solid var(--line);background:var(--panel);color:var(--ink);transition:filter .15s,background .15s;white-space:nowrap}
.btn:hover{background:var(--panel2)}
.btn svg{width:15px;height:15px}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.pri:hover{filter:brightness(1.08)}
.btn.holo{background:var(--holo);color:#fff;border-color:transparent}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink2)}
.btn.ghost:hover{background:var(--panel2);color:var(--ink)}
.btn.sm{padding:5px 11px;font-size:12.5px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.card .card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.card .card-h h3{font-size:15.5px}
.card .card-b{padding:16px 18px}
.grid{display:grid;gap:16px}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap}
.badge svg{width:11px;height:11px}
.b-ok{background:var(--ok-soft);color:var(--ok)} .b-warn{background:var(--amber-soft);color:var(--amber)}
.b-danger{background:var(--danger-soft);color:var(--danger)} .b-info{background:var(--info-soft);color:var(--info)}
.b-mut{background:var(--panel2);color:var(--ink2)} .b-acc{background:var(--accent-soft);color:var(--accent)} .b-holo{background:var(--holo-soft);color:var(--holo)}
.pbar{height:7px;background:var(--panel2);border-radius:99px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .5s ease}
.pbar.amber i{background:var(--amber)} .pbar.danger i{background:var(--danger)} .pbar.holo i{background:var(--holo)}
.empty{padding:34px 18px;text-align:center;color:var(--ink3);font-size:13.5px}
.empty svg{width:30px;height:30px;margin-bottom:8px;opacity:.5}
.row-item{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--line)}
.row-item:last-child{border-bottom:none}
.row-item .grow{flex:1;min-width:0}
.row-item .t{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-item .s{font-size:12px;color:var(--ink3)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:7px;background:var(--panel2);color:var(--ink2)}
.chip svg{width:11px;height:11px}
.subj-dot{width:9px;height:9px;border-radius:3px;flex:none}
.tabs{display:flex;gap:4px;background:var(--panel2);padding:4px;border-radius:11px;width:max-content;max-width:100%;overflow-x:auto}
.tabs button{padding:6px 13px;border-radius:8px;font-weight:600;font-size:12.5px;color:var(--ink2);white-space:nowrap}
.tabs button.on{background:var(--panel);color:var(--ink);box-shadow:var(--sh)}

.stat-strip{display:flex;gap:0;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);overflow-x:auto}
.stat{flex:1;min-width:118px;padding:14px 16px;border-right:1px solid var(--line)}
.stat:last-child{border-right:none}
.stat .k{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--ink3);white-space:nowrap}
.stat .v{font-family:var(--fd);font-size:25px;font-weight:600;margin-top:2px;line-height:1.1}
.stat .v small{font-size:13px;font-family:var(--fs);font-weight:600;color:var(--ink3)}
.stat.warn .v{color:var(--amber)} .stat.bad .v{color:var(--danger)} .stat.good .v{color:var(--accent)}

.tl{position:relative;padding-left:20px}
.tl::before{content:"";position:absolute;left:6px;top:8px;bottom:8px;width:2px;background:var(--line)}
.tl-item{position:relative;padding:0 0 16px 8px}
.tl-item::before{content:"";position:absolute;left:-19px;top:5px;width:12px;height:12px;border-radius:99px;background:var(--panel);border:3px solid var(--ink3)}
.tl-item.now::before{border-color:var(--accent);background:var(--accent)}
.tl-item.past{opacity:.55}

.mback{position:fixed;inset:0;background:rgba(20,20,15,.5);backdrop-filter:blur(3px);z-index:100;display:grid;place-items:center;padding:16px;animation:fin .18s ease}
@keyframes fin{from{opacity:0}to{opacity:1}}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--sh-lg);width:100%;max-width:560px;max-height:90dvh;display:flex;flex-direction:column;animation:min .22s cubic-bezier(.2,.9,.3,1.2)}
@keyframes min{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}
.modal.lg{max-width:760px}
.modal-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:18px 22px 0}
.modal-h h3{font-size:19px}
.modal-b{padding:16px 22px;overflow-y:auto}
.modal-f{display:flex;justify-content:flex-end;gap:9px;padding:0 22px 20px}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.frow .full{grid-column:1/-1}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:12px;font-weight:700;color:var(--ink2);margin-bottom:5px}
.fld input,.fld select,.fld textarea{width:100%;padding:9px 12px;border:1px solid var(--line2);border-radius:10px;background:var(--bg);font-size:13.5px}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--accent);outline:none}
.fld textarea{resize:vertical;min-height:74px}
.fld .range-wrap{display:flex;align-items:center;gap:10px}
.fld input[type=range]{flex:1;padding:0;accent-color:var(--accent)}
.fld .range-v{font-weight:700;min-width:26px;text-align:center;font-family:var(--fd)}
.hint{font-size:12px;color:var(--ink3);margin-top:4px}

#toasts{position:fixed;bottom:20px;right:20px;z-index:200;display:flex;flex-direction:column;gap:9px;max-width:380px}
.toast{background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:12px;box-shadow:var(--sh-lg);font-size:13.5px;font-weight:500;display:flex;gap:10px;align-items:flex-start;animation:tin .3s cubic-bezier(.2,.9,.3,1.2)}
.toast svg{width:16px;height:16px;flex:none;margin-top:1px}
.toast .t-act{margin-left:8px;background:rgba(255,255,255,.18);color:inherit;border-radius:7px;padding:2px 10px;font-weight:700;font-size:12px}
[data-theme="dark"] .toast{background:#eeeadd;color:#1b1a15}
[data-theme="dark"] .toast .t-act{background:rgba(0,0,0,.15)}
@keyframes tin{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}

.npanel{position:fixed;top:64px;right:18px;width:min(380px,calc(100vw - 24px));max-height:70vh;overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-lg);z-index:95;display:none}
.npanel.open{display:block}
.nitem{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;gap:10px;font-size:13px}
.nitem:last-child{border:none}
.nitem .ni{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none;background:var(--accent-soft);color:var(--accent)}
.nitem .ni svg{width:15px;height:15px}
.nitem .when{font-size:11px;color:var(--ink3);margin-top:2px}
.nitem.unread{background:var(--accent-soft)}

.hero{display:grid;grid-template-columns:270px 1fr 330px;gap:16px;margin-bottom:16px}
.ring-wrap{display:flex;flex-direction:column;align-items:center;padding:20px}
.ring-wrap canvas{width:158px;height:158px}
.ring-num{font-family:var(--fd);font-size:33px;font-weight:600;margin-top:-116px;pointer-events:none;line-height:1}
.ring-lab{margin-top:84px;font-size:12px;font-weight:600;color:var(--ink3);text-align:center}
.brief{background:var(--accent);color:var(--accent-ink);border-radius:var(--r);padding:16px 18px;margin-bottom:16px;display:flex;gap:14px;align-items:flex-start}
.brief svg{width:20px;height:20px;flex:none;margin-top:2px}
.brief ol{margin:6px 0 0 18px}
.brief li{margin:2px 0}
.nowcard .blk{padding:12px 0;border-bottom:1px solid var(--line)}
.nowcard .blk:last-child{border:none}
.aicard{background:var(--panel);border:1px solid var(--accent);border-radius:var(--r);padding:16px;box-shadow:var(--sh);display:flex;flex-direction:column;gap:9px}
.aicard .why{display:flex;flex-wrap:wrap;gap:6px}
.dash-grid{display:grid;grid-template-columns:1.25fr 1fr;gap:16px;margin-bottom:16px}
.daybar{display:flex;height:44px;border-radius:10px;overflow:hidden;border:1px solid var(--line);margin:10px 0 6px;position:relative}
.daybar .seg{height:100%}
.daybar .nowline{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--danger);z-index:2}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:11.5px;color:var(--ink2);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:9px;height:9px;border-radius:3px}

/* ── HOLOGRAPHIC ROBOT ── */
.bot-card{display:flex;flex-direction:column;overflow:hidden;border-color:var(--line)}
.bot-stage{position:relative;height:168px;display:grid;place-items:center;flex:none}
.bot-stage svg{width:126px;height:auto;color:var(--holo);animation:botfloat 3.6s ease-in-out infinite;filter:drop-shadow(0 0 14px var(--holo-soft))}
@keyframes botfloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.bot-stage::after{content:"";position:absolute;inset:8px 10px 26px;pointer-events:none;background:repeating-linear-gradient(0deg,transparent 0 3px,var(--holo-soft) 3px 4px);mix-blend-mode:multiply;border-radius:12px}
[data-theme="dark"] .bot-stage::after{mix-blend-mode:screen;opacity:.6}
.bot-stage{animation:holoflicker 5s steps(1) infinite}
@keyframes holoflicker{0%,100%{opacity:1}7%{opacity:.92}8%{opacity:1}54%{opacity:.95}55%{opacity:1}}
.bot-base{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);width:96px;height:12px;border-radius:50%;background:var(--holo-soft);border:1px dashed var(--holo)}
.bot-eye{transform-box:fill-box;transform-origin:center;animation:botblink 4.4s infinite}
@keyframes botblink{0%,91%,100%{transform:scaleY(1)}94%{transform:scaleY(.08)}}
.bot-core-ring{transform-box:fill-box;transform-origin:center;animation:corepulse 2.4s ease-in-out infinite}
@keyframes corepulse{0%,100%{transform:scale(1);opacity:.7}50%{transform:scale(1.22);opacity:.25}}
.bot-tip{transform-box:fill-box;transform-origin:center}
.listening .bot-tip{animation:tipflash .7s ease-in-out infinite}
@keyframes tipflash{0%,100%{opacity:1;transform:scale(1.15)}50%{opacity:.3;transform:scale(.8)}}
.bot-mouth{transform-box:fill-box;transform-origin:center}
.speaking .bot-mouth{animation:botmouth .32s ease-in-out infinite}
@keyframes botmouth{0%,100%{transform:scaleY(1)}50%{transform:scaleY(2.6)}}
.thinking .bot-eye{animation:botlook 1s ease-in-out infinite}
@keyframes botlook{0%,100%{transform:translateX(0)}30%{transform:translateX(2.5px)}65%{transform:translateX(-2.5px)}}
.listening .bot-ring,.speaking .bot-ring{position:absolute;inset:18px;border-radius:50%;border:2px solid var(--holo);opacity:0;animation:botring 1.5s ease-out infinite;pointer-events:none}
.listening .bot-ring:nth-child(2),.speaking .bot-ring:nth-child(2){animation-delay:.75s}
@keyframes botring{from{transform:scale(.55);opacity:.7}to{transform:scale(1.25);opacity:0}}
.bot-bubble{margin:-6px 14px 10px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 13px;font-size:13px;min-height:56px;position:relative}
.bot-bubble::before{content:"";position:absolute;top:-6px;left:50%;width:11px;height:11px;background:var(--panel2);border-left:1px solid var(--line);border-top:1px solid var(--line);transform:translateX(-50%) rotate(45deg)}
.bot-ctl{display:flex;gap:8px;padding:0 14px 14px;align-items:center}
.mic-btn{width:52px;height:52px;border-radius:50%;background:var(--holo);color:#fff;display:grid;place-items:center;flex:none;transition:transform .15s;position:relative}
.mic-btn:hover{transform:scale(1.06)}
.mic-btn.live{background:var(--danger);animation:micpulse 1.1s ease-in-out infinite}
@keyframes micpulse{0%,100%{box-shadow:0 0 0 0 var(--danger-soft)}50%{box-shadow:0 0 0 9px var(--danger-soft)}}
.mic-btn svg{width:22px;height:22px}
.bot-in{flex:1;display:flex;flex-direction:column;gap:6px}
.bot-in input{width:100%;padding:9px 12px;border:1px solid var(--line2);border-radius:10px;background:var(--bg);font-size:13px}
.bot-in input:focus{border-color:var(--holo);outline:none}
.vm-log{max-height:150px;overflow-y:auto;font-size:13px;margin-bottom:10px}
.vm-log .you{color:var(--ink2);margin:6px 0}
.vm-log .bot-r{background:var(--holo-soft);border-radius:10px;padding:8px 11px;white-space:pre-wrap}

.qa{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:16px}
.qa button{display:inline-flex;align-items:center;gap:8px;padding:10px 15px;background:var(--panel);border:1px solid var(--line);border-radius:12px;font-weight:600;font-size:13px;color:var(--ink2);transition:all .15s;box-shadow:var(--sh)}
.qa button:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-1px)}
.qa button svg{width:15px;height:15px}

.cal-head{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-dow{font-size:11px;font-weight:700;text-transform:uppercase;color:var(--ink3);text-align:center;padding:4px 0}
.cal-cell{background:var(--panel);border:1px solid var(--line);border-radius:10px;min-height:78px;padding:6px 7px;cursor:pointer;transition:border-color .15s;font-size:12px}
.cal-cell:hover{border-color:var(--accent)}
.cal-cell.out{opacity:.4}
.cal-cell.today{border-color:var(--accent);border-width:2px}
.cal-cell .d{font-weight:700;font-size:12.5px}
.cal-dots{display:flex;flex-wrap:wrap;gap:3px;margin-top:5px}
.cal-dots i{width:7px;height:7px;border-radius:99px}
.cal-ev{display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 9px;margin-bottom:6px;cursor:pointer;font-size:12.5px}
.cal-ev:hover{border-color:var(--accent)}
.week-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.week-col{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px;min-height:180px}
.week-col.today{border-color:var(--accent)}
.week-col .wh{font-weight:700;font-size:12px;text-align:center;padding-bottom:7px;border-bottom:1px solid var(--line);margin-bottom:8px}

.focus-wrap{max-width:540px;margin:0 auto;text-align:center}
.focus-ring{position:relative;width:250px;height:250px;margin:14px auto}
.focus-ring canvas{width:250px;height:250px}
.focus-time{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--fd);font-size:52px;font-weight:600}
.focus-ctl{display:flex;justify-content:center;gap:10px;margin:14px 0;flex-wrap:wrap}

.chat-wrap{display:flex;flex-direction:column;height:calc(100dvh - 170px);max-height:760px}
.chat-log{flex:1;overflow-y:auto;padding:6px 2px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:82%;padding:11px 15px;border-radius:15px;font-size:13.5px;white-space:pre-wrap;word-break:break-word}
.msg.user{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px}
.msg.ai{align-self:flex-start;background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:4px;box-shadow:var(--sh)}
.chat-in{display:flex;gap:9px;padding-top:12px;border-top:1px solid var(--line);margin-top:8px}
.chat-in input{flex:1;padding:11px 15px;border:1px solid var(--line2);border-radius:12px;background:var(--panel)}
.chat-in input:focus{border-color:var(--accent);outline:none}
.chips{display:flex;gap:7px;flex-wrap:wrap;padding-bottom:10px}
.chips button{font-size:12px;font-weight:600;padding:6px 12px;border-radius:99px;background:var(--panel2);color:var(--ink2)}
.chips button:hover{background:var(--accent-soft);color:var(--accent)}

.subj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.subj-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:17px;box-shadow:var(--sh)}
.subj-card .sc-h{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.chapter{border:1px solid var(--line);border-radius:10px;margin-bottom:8px;overflow:hidden}
.chapter>.ch-h{display:flex;align-items:center;gap:9px;padding:9px 12px;background:var(--panel2);font-weight:600;font-size:13px;cursor:pointer}
.topic{display:flex;align-items:center;gap:8px;padding:7px 12px;border-top:1px solid var(--line);font-size:13px}
.topic .conf{margin-left:auto;font-size:11px;font-weight:700}
.att-row{display:flex;align-items:center;gap:7px;background:var(--panel2);border-radius:9px;padding:7px 10px;margin-top:10px;font-size:12.5px}
details.res details summary,summary{cursor:pointer}

/* flashcards */
.fc-stage{perspective:900px;height:200px;margin-bottom:14px;cursor:pointer}
.fc-inner{position:relative;width:100%;height:100%;transition:transform .45s cubic-bezier(.3,.8,.3,1);transform-style:preserve-3d}
.fc-inner.flipped{transform:rotateY(180deg)}
.fc-face{position:absolute;inset:0;backface-visibility:hidden;border:1px solid var(--line);border-radius:14px;background:var(--panel2);display:grid;place-items:center;padding:18px;font-size:15.5px;text-align:center;white-space:pre-wrap;overflow-y:auto}
.fc-face.back{transform:rotateY(180deg);background:var(--accent-soft);border-color:var(--accent)}
.fc-grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.fc-grades button{padding:10px 4px;border-radius:10px;border:1px solid var(--line);font-weight:700;font-size:12.5px;background:var(--panel)}
.fc-grades button:hover{border-color:var(--accent)}
.fc-grades .g-again{color:var(--danger)} .fc-grades .g-hard{color:var(--amber)} .fc-grades .g-good{color:var(--accent)} .fc-grades .g-easy{color:var(--info)}

/* heatmap */
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,13px);gap:3px;overflow-x:auto;padding:4px 0}
.heat i{width:13px;height:13px;border-radius:3px;background:var(--panel2)}
.heat i.l1{background:color-mix(in srgb,var(--accent) 25%,var(--panel2))}
.heat i.l2{background:color-mix(in srgb,var(--accent) 50%,var(--panel2))}
.heat i.l3{background:color-mix(in srgb,var(--accent) 75%,var(--panel2))}
.heat i.l4{background:var(--accent)}

.habit-grid{font-size:12px;overflow-x:auto}
.habit-row{display:flex;align-items:center;gap:10px;padding:5px 0;border-top:1px solid var(--line)}
.habit-cells{display:flex;gap:4px}
.habit-cells button{width:23px;height:24px;border-radius:7px;border:1px solid var(--line2);background:var(--panel);display:grid;place-items:center}
.habit-cells button.on{background:var(--accent);border-color:var(--accent)}
.habit-cells button.on::after{content:"";width:8px;height:8px;border-radius:2px;background:var(--accent-ink)}
.habit-cell-d{width:23px;text-align:center;font-size:9.5px;color:var(--ink3)}

.ob-step{display:none}.ob-step.on{display:block}
.ob-progress{display:flex;gap:6px;margin-bottom:18px}
.ob-progress i{height:4px;flex:1;border-radius:99px;background:var(--panel2)}
.ob-progress i.on{background:var(--accent)}

.bottom-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--panel);border-top:1px solid var(--line);z-index:80;padding:6px 4px calc(6px + env(safe-area-inset-bottom));grid-template-columns:repeat(5,1fr)}
.bottom-nav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:600;color:var(--ink3);padding:5px 0}
.bottom-nav button svg{width:20px;height:20px}
.bottom-nav button.on{color:var(--accent)}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:55;display:none}
.scrim.open{display:block}
.fab{display:none;position:fixed;left:16px;bottom:calc(72px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;background:var(--holo);color:#fff;z-index:70;box-shadow:var(--sh-lg);place-items:center}
.fab svg{width:24px;height:24px}
.gpa-row{display:grid;grid-template-columns:1fr 78px 110px;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px}
.gpa-row input,.gpa-row select{padding:5px 8px;border:1px solid var(--line2);border-radius:8px;background:var(--bg);width:100%}

@media(max-width:1080px){
  .hero{grid-template-columns:250px 1fr}
  .hero .bot-card{grid-column:1/-1;flex-direction:row;align-items:center;gap:8px}
  .hero .bot-card .bot-stage{width:130px;height:130px}
  .hero .bot-card .bot-bubble{margin:0;flex:1}
  .hero .bot-card .bot-ctl{flex-direction:column;padding:0 12px 0 0}
  .dash-grid{grid-template-columns:1fr}
}
@media(max-width:900px){
  .app{grid-template-columns:1fr}
  .sidebar{position:fixed;left:0;top:0;bottom:0;width:250px;transform:translateX(-105%);transition:transform .25s ease;box-shadow:var(--sh-lg)}
  .sidebar.open{transform:none}
  .topbar,main{grid-column:1}
  .burger{display:grid}
  .bottom-nav{display:grid}
  .fab{display:grid}
  main{padding:16px 14px 100px}
  .hero{grid-template-columns:1fr}
  .week-grid{grid-template-columns:1fr}
  .week-col{min-height:0}
  .stat{min-width:104px}
  #toasts{left:14px;right:14px;bottom:86px;max-width:none}
  .npanel{top:60px;right:10px}
  .frow{grid-template-columns:1fr}
  .page-head h2{font-size:22px}
  .chat-wrap{height:calc(100dvh - 220px)}
  .hero .bot-card{flex-wrap:wrap}
  .hero .bot-card .bot-stage{width:110px;height:110px}
  .hero .bot-card .bot-stage svg{width:88px}
}

const Store=(()=>{
  const SKEY='studyos_state_v2';let db=null,idbOK=false;
  function openIDB(){return new Promise(res=>{try{const r=indexedDB.open('studyos',1);
    r.onupgradeneeded=()=>r.result.createObjectStore('kv');
    r.onsuccess=()=>{db=r.result;idbOK=true;res();};r.onerror=()=>res();setTimeout(()=>res(),1500);}catch(e){res();}});}
  const idbSet=v=>new Promise(res=>{if(!idbOK)return res();try{const t=db.transaction('kv','readwrite');t.objectStore('kv').put(v,'state');t.oncomplete=res;t.onerror=res;}catch(e){res();}});
  const idbGet=()=>new Promise(res=>{if(!idbOK)return res(null);try{const t=db.transaction('kv','readonly');const q=t.objectStore('kv').get('state');q.onsuccess=()=>res(q.result||null);q.onerror=()=>res(null);}catch(e){res(null);}});
  async function load(){await openIDB();let s=await idbGet();
    if(!s){try{s=JSON.parse(localStorage.getItem('studyos_state_v1')||'null');if(s)migrate(s);}catch(e){}}
    return s;}
  function migrate(s){/* v1→v2 defaults */s.trash=s.trash||[];s.flashcards=s.flashcards||[];s.attendance=s.attendance||[];
    s.settings=Object.assign({voiceLang:'en-US',autoSpeak:true,ambient:'none',uiBn:false,longBreak:15},s.settings);

    s.exams.forEach(x=>x.checklist=x.checklist||[]);
    s.settings.focusMin=s.settings.focusMin||25;return s;}
  function saveSync(s){try{localStorage.setItem(SKEY,JSON.stringify(s));}catch(e){}idbSet(s);}
  return {load,saveSync};
})();

/* attendance */
function attendanceStats(subjectId){
  const recs=state.attendance.filter(a=>a.subjectId===subjectId);
  const p=recs.filter(a=>a.status==='present').length,ab=recs.filter(a=>a.status==='absent').length;
  const pctV=pct(p,p+ab);
  let risk=null;
  if(p+ab>0&&pctV<75){ // how many consecutive presents needed to reach 75%
    let need=0,pp=p,aa=ab;while((pp)/(pp+aa)<0.75&&need<200){pp++;need++;}
    risk=need;
  }
  return{present:p,absent:ab,total:p+ab,pct:pctV,risk};
}

const GRADES=[['A+',4],['A',3.75],['A-',3.5],['B+',3.25],['B',3],['B-',2.75],['C+',2.5],['C',2.25],['D',2],['F',0]];

function gradeCard(card,q){ // q: again/hard/good/easy
  const today=todayISO();
  if(q==='again'){card.interval=0;card.ease=Math.max(1.3,(card.ease||2.5)-0.15);card.due=today;}
  else{
    if(q==='hard'){card.interval=Math.max(1,Math.round((card.interval||1)*1.2));card.ease=Math.max(1.3,(card.ease||2.5)-0.05);}
    else if(q==='good'){card.interval=card.interval?Math.round(card.interval*(card.ease||2.5)):1;}
    else{card.interval=card.interval?Math.round(card.interval*(card.ease||2.5)*1.3):3;card.ease=(card.ease||2.5)+0.1;}
    card.interval=Math.min(card.interval,365);card.due=addDays(today,card.interval);card.reps=(card.reps||0)+1;
  }

}
/* best study window */
function bestWindow(){
  const buckets={};
  state.sessions.forEach(s=>{
    if(!s.start)return;const h=parseInt(s.start.split(':')[0]);
    if(h<5||h>23)return;const k=h-(h%2);
    buckets[k]=buckets[k]||{n:0,f:0,m:0};
    buckets[k].n++;buckets[k].f+=(s.focus||3);buckets[k].m+=s.duration;
  });
  const arr=Object.entries(buckets).filter(([,v])=>v.n>=2).map(([k,v])=>({h:Number(k),focus:v.f/v.n,min:v.m/v.n}));
  if(!arr.length)return null;
  return arr.sort((a,b)=>b.focus-a.focus)[0];
}

const REV_INTERVALS=[1,3,7,14,30];
function scheduleRevision(subjectId,topic,confidence){

  let r=state.revisions.find(v=>v.subjectId===subjectId&&v.topic.toLowerCase()===topic.toLowerCase());
  if(r){r.due=due;r.confidence=confidence;r.history.push({date:todayISO(),confidence});}
  else state.revisions.push({id:uid(),subjectId,topic,due,confidence,history:[{date:todayISO(),confidence}]});

}

/* recommendation engine */
function examNear(subjectId){return state.exams.some(e=>e.subjectId===subjectId&&e.date>=todayISO()&&daysBetween(todayISO(),e.date)<=14);}
function recommendNow(){
  const td=todayISO(),tgt=state.user.targetMin||180,left=Math.max(0,tgt-minutesOn(td));
  const cands=[];
  state.tasks.forEach(k=>{
    if(['Completed','Skipped'].includes(k.status))return;
    const od=(k.date&&k.date<td)?daysBetween(k.date,td):0,dd=k.deadline?daysBetween(td,k.deadline):99;
    const sc=(PRIORITY[k.priority]||2)*2+od*2.5+(dd<=0?4:dd<=3?2:0)+(examNear(k.subjectId)?3:0);
    cands.push({kind:'task',title:k.title,subject:k.subjectId,topic:k.topic,est:k.est||45,min:Math.min(k.est||45,Math.max(25,left||45)),sc,obj:k,
      why:[...(od?['overdue '+od+'d']:[]),...(dd<=0?['due today']:[]),...(examNear(k.subjectId)?['exam soon']:[]),...(k.priority==='high'?['high priority']:[])]});
  });
  state.revisions.forEach(r=>{
    if(r.due>td)return;
    const sc=2+(r.confidence<=2?3:0)+(examNear(r.subjectId)?2:0)+(r.due<td?1.5:0);
    cands.push({kind:'rev',title:'Revise: '+r.topic,subject:r.subjectId,topic:r.topic,est:25,min:25,sc,obj:r,
      why:[r.due<td?'revision overdue':'revision due today',...(r.confidence&&r.confidence<=2?['low confidence']:[]),...(examNear(r.subjectId)?['exam soon']:[])]});
  });
  if(!cands.length)return null;
  cands.sort((a,b)=>b.sc-a.sc);
  const c=cands[0];
  return{...c,reasons:c.why.length?c.why:['fits your remaining study target'],targetLeft:left};
}

function catchUpPlan(){const items=outstandingItems(),tgt=state.user.targetMin||180;
  const capToday=Math.max(60,tgt-minutesOn(todayISO())),capTmr=tgt;
  const today=[],tomorrow=[],later=[];let c1=capToday,c2=capTmr;

  return{items,today,tomorrow,later,capToday:capToday-c1,capTmr:capTmr-c2};}

function routineGaps(blocks){
  const gaps=[];const wake=Math.min(...blocks.map(b=>toMin(b.start)),toMin(state.user.wake));
  const sleep=Math.max(...blocks.map(b=>toMin(b.end)),toMin(state.user.sleep));

let modalStack=[];
function modal(title,bodyHTML,footerHTML='',opts={}){
  const back=document.createElement('div');back.className='mback';
  back.innerHTML=`<div class="modal ${opts.lg?'lg':''}" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <div class="modal-h"><h3>${esc(title)}</h3><button class="icon-btn" data-close aria-label="Close">${I('x',18)}</button></div>
    <div class="modal-b">${bodyHTML}</div>${footerHTML?`<div class="modal-f">${footerHTML}</div>`:''}</div>`;
  document.body.appendChild(back);
  const close=()=>{back.remove();modalStack=modalStack.filter(m=>m.el!==back);opts.onClose&&opts.onClose();};
  back.addEventListener('mousedown',e=>{if(e.target===back&&!opts.static)close();});
  back.querySelector('[data-close]').onclick=close;
  modalStack.push({el:back,close});
  const f=back.querySelector('input,select,textarea,button:not([data-close])');if(f)setTimeout(()=>f.focus(),60);
  return{el:back,close};
}
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&modalStack.length){const m=modalStack.pop();m.close();}
  if(e.key==='/'&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){e.preventDefault();$('#globalSearch').focus();}
});

function fieldHTML(f){
  const v=f.val??'',req=f.req?' required':'';
  let inner='';
  switch(f.t){
    case 'select':inner=`<select name="${f.k}"${req}>${(f.o||[]).map(o=>{const ov=o.v??o,ol=o.l??o;return `<option value="${esc(ov)}"${String(ov)===String(v)?' selected':''}>${esc(ol)}</option>`;}).join('')}</select>`;break;
    case 'textarea':inner=`<textarea name="${f.k}"${req} placeholder="${esc(f.ph||'')}">${esc(v)}</textarea>`;break;
    case 'range':inner=`<div class="range-wrap"><input type="range" name="${f.k}" min="${f.min||1}" max="${f.max||5}" value="${v||3}" oninput="this.nextElementSibling.textContent=this.value"><span class="range-v">${v||3}</span></div>`;break;
    case 'checkbox':return `<div class="fld"><label style="display:flex;gap:8px;align-items:center;cursor:pointer"><input type="checkbox" name="${f.k}" ${v?'checked':''} style="width:auto"> ${esc(f.label)}</label></div>`;
    default:inner=`<input type="${f.t||'text'}" name="${f.k}" value="${esc(v)}"${req}${f.min!==undefined?` min="${f.min}"`:''}${f.max!==undefined?` max="${f.max}"`:''} placeholder="${esc(f.ph||'')}">`;
  }
  return `<div class="fld ${f.half===false?'full':''}"><label>${esc(f.label)}${req?' *':''}</label>${inner}${f.hint?`<div class="hint">${f.hint}</div>`:''}</div>`;
}
function wrapFields(fields){
  let html='',pair=[];
  fields.forEach(f=>{
    const full=f.half===false||f.t==='textarea'||f.t==='range';
    if(full){if(pair.length){html+=`<div class="frow">${pair.join('')}</div>`;pair=[];}
      html+=`<div class="frow"><div class="full">${fieldHTML(f)}</div></div>`;}
    else{pair.push(fieldHTML(f));if(pair.length===2){html+=`<div class="frow">${pair.join('')}</div>`;pair=[];}}
  });
  if(pair.length)html+=`<div class="frow">${pair[0]}</div>`;
  return html;
}
function formModal(title,fields,onSubmit,submitLabel='Save'){

  m.el.querySelector('[data-ok]').onclick=()=>{

      if(f.t==='checkbox'){vals[f.k]=form.elements[f.k].checked;return;}
      let v=fd.get(f.k);if(v===null)return;
      if(f.t==='number')v=v===''?null:Number(v);
      vals[f.k]=typeof v==='string'?v.trim():v;
    });
    onSubmit(vals,m);
  };
  form.addEventListener('submit',e=>{e.preventDefault();m.el.querySelector('[data-ok]').click();});
  return m;
}

function prepCanvas(cv){const dpr=window.devicePixelRatio||1,w=cv.clientWidth||300,h=cv.clientHeight||150;
  cv.width=w*dpr;cv.height=h*dpr;const ctx=cv.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);return{ctx,w,h};}
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
function ringChart(cv,p,color){const{ctx,w,h}=prepCanvas(cv);const cx=w/2,cy=h/2,r=Math.min(w,h)/2-8;
  ctx.lineWidth=11;ctx.lineCap='round';
  ctx.strokeStyle=css('--panel2');ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.stroke();
  ctx.strokeStyle=color||css('--accent');ctx.beginPath();ctx.arc(cx,cy,r,-Math.PI/2,-Math.PI/2+Math.PI*2*Math.min(1,p/100));ctx.stroke();}
function barChart(cv,data,{color}={}){const{ctx,w,h}=prepCanvas(cv);
  const padL=30,padB=20,padT=8,iw=w-padL-6,ih=h-padT-padB,max=Math.max(1,...data.map(d=>d.v));
  ctx.strokeStyle=css('--line');ctx.fillStyle=css('--ink3');ctx.font='10px Instrument Sans';ctx.lineWidth=1;
  [0,.5,1].forEach(f=>{const y=padT+ih*(1-f);ctx.beginPath();ctx.moveTo(padL,y);ctx.lineTo(w-4,y);ctx.stroke();ctx.fillText(String(Math.round(max*f)),4,y+3);});
  const bw=Math.min(26,iw/data.length*0.62),step=iw/data.length;
  data.forEach((d,i)=>{const bh=ih*(d.v/max),x=padL+step*i+(step-bw)/2,y=padT+ih-bh;
    if(d.v>0){ctx.fillStyle=d.c||color||css('--accent');ctx.beginPath();ctx.roundRect(x,y,bw,Math.max(2,bh),4);ctx.fill();}
    else{ctx.fillStyle=css('--line');ctx.fillRect(x,padT+ih-2,bw,2);}
    ctx.fillStyle=css('--ink3');ctx.textAlign='center';if(data.length<=16||i%2===0)ctx.fillText(d.l,padL+step*i+step/2,h-6);ctx.textAlign='left';});}
function lineChart(cv,data,{color,min=0,max}={}){const{ctx,w,h}=prepCanvas(cv);
  const padL=30,padB=18,padT=8,iw=w-padL-8,ih=h-padT-padB,mx=max??Math.max(1,...data.map(d=>d.v));
  ctx.strokeStyle=css('--line');ctx.fillStyle=css('--ink3');ctx.font='10px Instrument Sans';
  [0,.5,1].forEach(f=>{const y=padT+ih*(1-f);ctx.beginPath();ctx.moveTo(padL,y);ctx.lineTo(w-4,y);ctx.stroke();ctx.fillText(String(Math.round(min+(mx-min)*f)),4,y+3);});
  if(data.length<2){ctx.fillText('not enough data yet',padL+10,padT+ih/2);return;}
  const X=i=>padL+iw*(i/(data.length-1)),Y=v=>padT+ih*(1-(v-min)/(mx-min));
  ctx.strokeStyle=color||css('--accent');ctx.lineWidth=2;ctx.lineJoin='round';ctx.beginPath();
  data.forEach((d,i)=>i?ctx.lineTo(X(i),Y(d.v)):ctx.moveTo(X(0),Y(d.v)));ctx.stroke();
  ctx.lineTo(X(data.length-1),padT+ih);ctx.lineTo(X(0),padT+ih);ctx.closePath();
  ctx.fillStyle=color||css('--accent');ctx.globalAlpha=.09;ctx.fill();ctx.globalAlpha=1;
  data.forEach((d,i)=>{ctx.beginPath();ctx.arc(X(i),Y(d.v),2.5,0,7);ctx.fill();});}
function hbar(label,value,max,color){return `<div style="margin-bottom:9px"><div style="display:flex;justify-content:space-between;font-size:12.5px;font-weight:600;margin-bottom:4px"><span>${esc(label)}</span><span class="num" style="color:var(--ink3)">${value}${max>0&&value<=max?'/'+max:''}</span></div><div class="pbar"><i style="width:${pct(value,max)}%;background:${color||'var(--accent)'}"></i></div></div>`;}

      for(let i=0;i<len;i++){
        const white=Math.random()*2-1;
        if(type==='brown'){last=(last+0.02*white)/1.02;data[i]=last*3.5;}
        else data[i]=white*0.6;
      }
      this.src=this.ctx.createBufferSource();this.src.buffer=buf;this.src.loop=true;
      const filt=this.ctx.createBiquadFilter();
      if(type==='rain'){filt.type='lowpass';filt.frequency.value=1200;}else if(type==='brown'){filt.type='lowpass';filt.frequency.value=700;}else filt.type='highpass',filt.frequency.value=80;
      this.gain=this.ctx.createGain();this.gain.gain.value=type==='white'?0.025:0.05;
      this.src.connect(filt);filt.connect(this.gain);this.gain.connect(this.ctx.destination);
      this.src.start();
    }catch(e){}
  },
  stop(){try{this.src&&this.src.stop();}catch(e){}this.src=null;}
};

const Focus={mode:'pomodoro',customMin:50,remaining:25*60,total:25*60,running:false,paused:false,onBreak:false,cycle:0,distract:0,subjectId:null,topic:'',notes:'',timer:null,
  start(){this.total=this.remaining=this.mode==='pomodoro'?state.settings.focusMin*60:this.customMin*60;
    this.running=true;this.paused=false;this.distract=0;this.tickSetup();render();},
  tickSetup(){clearInterval(this.timer);
    this.timer=setInterval(()=>{if(this.running&&!this.paused){this.remaining--;
      const tv=$('#fTime');if(tv){tv.textContent=fmtClock(this.remaining);const rc=$('#fRing');rc&&ringChart(rc,100-(this.remaining/this.total*100),css('--holo'));}
      if(this.remaining<=0){clearInterval(this.timer);
        if(!this.onBreak&&this.mode==='pomodoro'){
          this.cycle++;const long=this.cycle%4===0;
          this.onBreak=true;const bd=long?state.settings.longBreak:state.settings.breakMin;
          this.total=this.remaining=bd*60;beep();
          toast(long?'4 blocks done — long break time':'Focus block done — take your break','ok');render();this.tickSetup();}
        else this.finish(true);}
    }},1000);},
  toggle(){if(!this.running){this.start();return;}this.paused=!this.paused;render();},
  reset(){clearInterval(this.timer);this.running=false;this.paused=false;this.onBreak=false;
    document.title='AI StudyOS — Personal Study Assistant';
    this.remaining=this.mode==='pomodoro'?state.settings.focusMin*60:this.customMin*60;this.total=this.remaining;render();},
  finish(auto){
    clearInterval(this.timer);const planned=Math.round(this.total/60),actual=Math.round((this.total-this.remaining)/60);
    this.running=false;this.paused=false;this.onBreak=false;document.title='AI StudyOS — Personal Study Assistant';
    if(actual<1&&!auto){this.reset();return;}
    formModal(auto?'Session complete':'Finish session',[
      {k:'subjectId',label:'Subject',t:'select',o:state.subjects.map(s=>({v:s.id,l:s.name})),val:Focus.subjectId||(state.subjects[0]||{}).id},
      {k:'topic',label:'Topic',val:Focus.topic,half:true},
      {k:'focus',label:'How focused were you? (1–5)',t:'range',min:1,max:5,val:3,half:true},
      {k:'notes',label:'Session notes',t:'textarea',val:Focus.notes,hint:`Planned ${planned} min · actual ${actual} min (${pct(actual,planned)}%) · distractions: ${Focus.distract}`}
    ],(v,m)=>{
      state.sessions.push({id:uid(),date:todayISO(),start:nowHM(),duration:actual,planned,completion:pct(actual,planned),distractions:Focus.distract,...v});
      const s=subj(v.subjectId);if(s)s.hours=(s.hours||0)+actual;
      save();m.close();render();toast(`Session logged: ${fmtMin(actual)} of ${subjName(v.subjectId)}`,'ok');
    },'Log session');
  }};

/* text to speech */
function speak(text,forceLang){
  if(!state.settings.autoSpeak||!('speechSynthesis'in window))return;
  const bn=isBnText(text)||forceLang==='bn'||(!forceLang&&state.settings.voiceLang==='bn-BD');
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text.slice(0,400));
    u.lang=bn?'bn-BD':'en-US';u.rate=.97;
    const v=speechSynthesis.getVoices().find(v=>v.lang&&v.lang.startsWith(bn?'bn':'en'));
    if(v)u.voice=v;
    u.onstart=()=>Bot.setState('speaking');
    u.onend=u.onerror=()=>Bot.setState('idle');
    speechSynthesis.speak(u);
  }catch(e){}
}

/* ── CALENDAR ── */
let calMode='month',calAnchor=todayISO();
Views.calendar=function(){
  const anchor=pd(calAnchor);
  let body='';
  const eventsFor=iso=>{const ev=[];
    state.tasks.forEach(x=>{if(x.date===iso||x.deadline===iso)ev.push({t:x.title,type:'task',color:subjColor(x.subjectId),obj:x,kind:'Task',st:x.status});});
    state.assignments.forEach(a=>{if(a.due===iso)ev.push({t:a.title,type:'assign',color:'var(--amber)',obj:a,kind:'Assignment'});});
    state.exams.forEach(e=>{if(e.date===iso)ev.push({t:e.name,type:'exam',color:'var(--danger)',obj:e,kind:'Exam'});});
    state.revisions.forEach(r=>{if(r.due===iso)ev.push({t:'Revise: '+r.topic,type:'rev',color:subjColor(r.subjectId),obj:r,kind:'Revision'});});
    sessionsOn(iso).forEach(s=>ev.push({t:'Studied: '+(s.topic||subjName(s.subjectId)),type:'sess',color:'var(--accent)',obj:s,kind:'Session ('+fmtMin(s.duration)+')'}));
    return ev;};
  if(calMode==='month'){
    const y=anchor.getFullYear(),m2=anchor.getMonth();
    const start=(new Date(y,m2,1).getDay()+6)%7,dim=new Date(y,m2+1,0).getDate(),dimPrev=new Date(y,m2,0).getDate();
    let cells='';
    for(let i=0;i<42;i++){
      const dn=i-start+1;let iso,cls='cal-cell',out=false;
      if(dn<1){iso=addDays(`${y}-${pad(m2+1)}-01`,dn-dimPrev);out=true;}
      else if(dn>dim){iso=addDays(`${y}-${pad(m2+1)}-${pad(dim)}`,dn-dim);out=true;}
      else iso=`${y}-${pad(m2+1)}-${pad(dn)}`;
      if(out)cls+=' out';if(iso===todayISO())cls+=' today';
      cells+=`<div class="${cls}" data-act="calDay:${iso}" role="button" tabindex="0"><div class="d num">${dn<1?dimPrev+dn:dn>dim?dn-dim:dn}</div>
      <div class="cal-dots">${eventsFor(iso).slice(0,6).map(e=>`<i style="background:${e.color}"></i>`).join('')}</div></div>`;
    }
    body=`<div class="cal-grid">${(state.settings.uiBn?['সোম','মঙ্গল','বুধ','বৃহঃ','শুক্র','শনি','রবি']:['Mon','Tue','Wed','Thu','Fri','Sat','Sun']).map(d=>`<div class="cal-dow">${d}</div>`).join('')}${cells}</div>`;
  }else if(calMode==='week'){
    const dow=(anchor.getDay()+6)%7,mon=addDays(calAnchor,-dow);
    body=`<div class="week-grid">${[0,1,2,3,4,5,6].map(i=>{const iso=addDays(mon,i),ev=eventsFor(iso);
      return `<div class="week-col ${iso===todayISO()?'today':''}"><div class="wh">${WEEKDAYS[pd(iso).getDay()]} ${pd(iso).getDate()}</div>
      ${ev.length?ev.map(e=>`<div class="cal-ev" data-act="calEv:${e.type}:${e.obj.id}"><i class="subj-dot" style="background:${e.color}"></i><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(e.t)}</span></div>`).join(''):'<div style="font-size:11.5px;color:var(--ink3);text-align:center;padding:8px 0">—</div>'}</div>`;}).join('')}</div>`;
  }else{
    const ev=eventsFor(calAnchor),blocks=routineFor(calAnchor);
    body=`<div class="grid" style="grid-template-columns:1fr 1fr;align-items:start">
      <div class="card"><div class="card-h"><h3>Events</h3></div><div class="card-b" style="padding-top:4px">${ev.length?ev.map(e=>`<div class="cal-ev" data-act="calEv:${e.type}:${e.obj.id}"><i class="subj-dot" style="background:${e.color}"></i><span>${esc(e.t)}</span><span class="badge b-mut" style="margin-left:auto">${e.kind}</span></div>`).join(''):'<div class="empty">No events</div>'}</div></div>
      <div class="card"><div class="card-h"><h3>Routine</h3></div><div class="card-b" style="padding-top:4px">${blocks.length?blocks.map(b=>`<div class="row-item"><div class="grow"><div class="t num">${b.start}–${b.end} ${esc(b.title)}</div></div><span class="chip" style="color:${CAT_COLORS[b.category]}">${esc(b.category)}</span></div>`).join(''):'<div class="empty">No blocks</div>'}</div></div></div>`;
  }
  return pageHead('Academic Calendar','ক্যালেন্ডার','Tasks, sessions, exams, revisions and deadlines in one place.','সবকিছু এক জায়গায়।')+
  `<div class="cal-head">
    <button class="icon-btn" data-act="calNav:-1" aria-label="Previous">${I('chevL')}</button>
    <strong style="min-width:150px;text-align:center;font-family:var(--fd);font-size:16px">${calMode==='month'?anchor.toLocaleDateString(undefined,{month:'long',year:'numeric'}):fmtDate(calAnchor)+(calMode==='week'?' · week':'')}</strong>
    <button class="icon-btn" data-act="calNav:1" aria-label="Next">${I('chevR')}</button>
    <button class="btn sm" data-act="calToday">Today</button>
    <div class="tabs" style="margin-left:auto">${['day','week','month'].map(m2=>`<button data-act="calMode:${m2}" class="${calMode===m2?'on':''}">${m2[0].toUpperCase()+m2.slice(1)}</button>`).join('')}</div>
  </div>${body}`;
};
function calEventModal(type,id){
  const lists={task:[state.tasks],assign:[state.assignments],exam:[state.exams],rev:[state.revisions],sess:[state.sessions]};
  const o=(lists[type]||[[]])[0].find(x=>x.id===id);
  if(!o){toast('Item no longer exists','warn');return;}
  const rows=[['Title',o.title||o.name||o.topic],['Subject',subjName(o.subjectId)]];
  if(o.status)rows.push(['Status',o.status]);
  if(o.duration)rows.push(['Duration',fmtMin(o.duration)]);
  if(o.focus)rows.push(['Focus',o.focus+'/5']);
  if(o.prep!==undefined)rows.push(['Preparation',o.prep+'%']);
  if(o.confidence)rows.push(['Confidence',confLabel(o.confidence)]);
  if(o.notes)rows.push(['Notes',o.notes]);
  const m=modal(type==='task'?'Task details':'Details',
    rows.map(([k,v])=>`<div style="display:flex;gap:12px;padding:6px 0;border-bottom:1px solid var(--line)"><strong style="min-width:100px;font-size:12.5px;color:var(--ink3)">${k}</strong><span style="font-size:13.5px">${esc(v)}</span></div>`).join(''),
    type==='task'?`<button class="btn pri" data-o>${I('edit',13)} Open in planner</button>`:'');
  const ob=m.el.querySelector('[data-o]');if(ob)ob.onclick=()=>{m.close();currentView='planner';render();};
}

function reviewSession(){

function showCard(){
  const R=FCRev;
  if(R.idx>=R.queue.length){
    const m=modal(t('Review complete','রিভিউ শেষ'),`<div style="text-align:center;padding:20px 0"><div style="font-size:44px">🎉</div>
      <p>${t('Reviewed','রিভিউ হলো')} <strong>${R.done}</strong> ${t('cards. Spaced repetition updated.','টা কার্ড। ইন্টারভাল আপডেট হলো।')}</p></div>`,
      `<button class="btn pri" data-x>${t('Done','ঠিক আছে')}</button>`);
    m.el.querySelector('[data-x]').onclick=()=>{m.close();render();};
    return;
  }
  const c=R.queue[R.idx];
  const m=modal(`${t('Card','কার্ড')} ${R.idx+1}/${R.queue.length} · ${esc(subjName(c.subjectId))}`,
    `<div class="fc-stage" data-act="cardFlip"><div class="fc-inner ${R.revealed?'flipped':''}" id="fcInner">
      <div class="fc-face">${esc(c.front)}</div><div class="fc-face back">${esc(c.back)}</div></div></div>
    <p class="hint" style="text-align:center">${R.revealed?t('How well did you know it?','কেমন জানতেন?'):t('Tap the card to reveal the answer','উত্তর দেখতে কার্ডে চাপ দিন')}</p>`,
    `<div style="width:100%"><div class="fc-grades" style="${R.revealed?'':'opacity:.4;pointer-events:none'}">
      <button class="g-again" data-g="again">${t('Again','ভুল')}</button><button class="g-hard" data-g="hard">${t('Hard','কঠিন')}</button>
      <button class="g-good" data-g="good">${t('Good','ভালো')}</button><button class="g-easy" data-g="easy">${t('Easy','সহজ')}</button></div></div>`,{static:false});
  m.el.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{
    gradeCard(c,b.dataset.g);R.done++;R.idx++;R.revealed=false;m.close();showCard();
  });

}

function afterAnalytics(){
  // heatmap
  const hm=$('#heatmap');
  if(hm){
    const dow=(pd(todayISO()).getDay()+6)%7,end=addDays(todayISO(),-(dow)-25*7);
    let html='';
    for(let w2=0;w2<26;w2++)for(let d=0;d<7;d++){
      const iso=addDays(end,w2*7+d);
      const m=minutesOn(iso);
      const lvl=m===0?'':m<45?'l1':m<90?'l2':m<150?'l3':'l4';
      html+=`<i class="${lvl}" title="${fmtDate(iso)} · ${fmtMin(m)}"></i>`;
    }
    hm.innerHTML=html;
  }
  // best window
  const bw=$('#bestWin');
  if(bw){
    const best=bestWindow();
    const buckets={};state.sessions.forEach(s=>{if(!s.start)return;const h=parseInt(s.start.split(':')[0]);if(h<5||h>23)return;
      const k=h-(h%2);buckets[k]=buckets[k]||{n:0,f:0,m:0};buckets[k].n++;buckets[k].f+=(s.focus||3);buckets[k].m+=s.duration;});
    bw.innerHTML=(best?`<p style="font-size:13.5px;margin-bottom:10px">${t('Your sharpest window is','আপনার সেরা সময়')} <strong class="num">${pad(best.h)}:00–${pad(best.h+2)}:00</strong> ${t('(avg focus','(গড় ফোকাস')} ${best.focus.toFixed(1)}/5${state.settings.uiBn?')':')'} — ${t('schedule hard topics there.','কঠিন টপিক এখানে রাখুন।')}</p>`:'<p class="hint">Log a few sessions to find your best hours.</p>')
    +`<canvas id="aH" style="width:100%;height:130px"></canvas>`;
    const c=$('#aH');if(c){const d=()=>barChart(c,Object.entries(buckets).sort((a,b)=>a[0]-b[0]).map(([k,v])=>({l:pad(Number(k))+'h',v:Math.round(v.m/v.n)})));d();chartRedraws.push(d);}
  }
  // subject distribution
  const asub=$('#aSub');
  if(asub){const bySub={};state.sessions.forEach(s=>bySub[s.subjectId||'none']=(bySub[s.subjectId||'none']||0)+s.duration);
    const e=Object.entries(bySub).sort((a,b)=>b[1]-a[1]),tot=e.reduce((a,[,v])=>a+v,0)||1;
    asub.innerHTML=e.length?e.map(([id,v])=>hbar(subjName(id),fmtMin(v),fmtMin(tot),subjColor(id))).join(''):'<div class="empty">Log focus sessions to see distribution</div>';}
  const bind=(sel,fn)=>{const c=$(sel);if(c){const d=()=>fn(c);d();chartRedraws.push(d);}};
  bind('#aD',c=>barChart(c,lastNDays(14).map(d=>({l:pd(d).getDate()+'',v:Math.round(minutesOn(d))}))));
  bind('#aW',c=>barChart(c,[...Array(8)].map((_,i)=>{const w=weekTotals(7-i);return{l:'W'+(i+1),v:Math.round(w.min)};}),{color:css('--info')}));
  bind('#aP',c=>lineChart(c,lastNDays(7).map(d=>{const ss=sessionsOn(d);return{l:pd(d).getDate()+'',v:ss.length?Math.round(ss.reduce((a,s)=>a+(s.focus||3),0)/ss.length*20):0};}),{min:0,max:100}));
  bind('#aT',c=>lineChart(c,state.tests.slice().sort((a,b)=>a.date<b.date?-1:1).map(x=>({l:'',v:Math.round(x.obtained/x.total*100)})),{min:0,max:100,color:css('--amber')}));
  bind('#aR',c=>barChart(c,lastNDays(14).map(d=>({l:pd(d).getDate()+'',v:state.revisions.filter(r=>r.history.some(h=>h.date===d)).length})),{color:css('--amber')}));

async function sendChat(text){
  if(!text.trim()||chatBusy)return;
  chatBusy=true;
  state.aiChats.push({role:'user',text,when:Date.now()});renderChat();save();
  await VoiceAI.handle(text); // same engine → also syncs with the robot

  chatBusy=false;renderChat();

/* ══════════ 13. ACTIONS ══════════ */
const Actions={
  nav(k){currentView=k;render();this.closeSidebar();},
  openSidebar(){$('#sidebar').classList.add('open');$('#scrim').classList.add('open');},
  closeSidebar(){$('#sidebar').classList.remove('open');$('#scrim').classList.remove('open');},
  toggleTheme(){state.settings.theme=state.settings.theme==='light'?'dark':'light';applyTheme();save();render();},
  toggleNotifPanel(){const p=$('#npanel'),open=p.classList.toggle('open');
    if(open){state.notifications.forEach(n=>n.read=true);save();renderNotifPanel();updateBell();}},
  clearNotifs(){state.notifications=[];save();renderNotifPanel();updateBell();},
  /* tasks */
  addTask(){if(!state.subjects.length){toast(t('Add a subject first','আগে সাবজেক্ট যোগ করুন'),'warn');return subjectForm();}taskForm();},
  editTask(id){const x=state.tasks.find(y=>y.id===id);if(x)taskForm(x);else calEventModal('task',id);},
  completeTask(id){const x=state.tasks.find(y=>y.id===id);if(!x)return;
    if(x.status==='Completed'){x.status='Not Started';save();render();return;}
    x.status='Completed';x.actual=x.actual||x.est||45;save();render();
    toast(t('Task completed — nice work','টাস্ক শেষ — দুর্দান্ত!'),'ok');
    if(x.topic&&x.subjectId)formModal(t('How confident are you?','কতটা কনফিডেন্ট?'),
      [{k:'c',label:t(`Confidence for "${x.topic}" (1 = lost, 5 = strong) — sets your next revision date`,`"${x.topic}" এর কনফিডেন্স (১–৫) — এটাই পরের রিভিশন ঠিক করবে`),t:'range',min:1,max:5,val:3}],
      (v,m)=>{scheduleRevision(x.subjectId,x.topic,v.c);m.close();toast(`${t('Revision scheduled in','রিভিশন')} ${REV_INTERVALS[v.c-1]} ${t('days','দিন পরে')}`,'ok');},t('Schedule revision','রিভিশন সেট'));},
  /* routine */

  export(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});

  sample(){confirmModal(t('Load the <strong>sample dataset</strong>? Your current data will be <strong>replaced</strong> (trash is not affected — nothing is lost permanently).','স্যাম্পল ডেটা লোড করবেন? বর্তমান ডেটা <strong>রিপ্লেস</strong> হবে।'),()=>{

  reset(){confirmModal(t('This <strong>permanently deletes all</strong> StudyOS data. Export a backup first!','<strong>সব ডেটা স্থায়ীভাবে মুছে যাবে!</strong> আগে ব্যাকআপ নিন।'),()=>{
    confirmModal(t('Really delete everything?','সত্যিই সব মুছবেন?'),()=>{state=freshState();saveNow();location.reload();},{label:t('Yes, delete all','হ্যাঁ, সব মুছুন')});},{label:t('Reset app','রিসেট')});},
  trashRestore(id){restoreTrash(id);},
  trashPurge(){confirmModal(t('Empty the trash permanently?','ট্র্যাশ স্থায়ীভাবে খালি করবেন?'),purgeTrash,{label:t('Empty trash','খালি করুন')});}

document.addEventListener('click',e=>{
  const a=e.target.closest('[data-act]');if(!a)return;
  if(a.tagName==='INPUT'&&a.type==='checkbox'&&a.dataset.act){const[k]=a.dataset.act.split(':');Actions[k]&&Actions[k](a);return;}
  const[fn,...rest]=a.dataset.act.split(':');
  if(Actions[fn])Actions[fn](rest.length?rest.join(':'):a,...rest);
});
document.addEventListener('change',e=>{
  const el=e.target.closest('[data-change]');if(!el)return;
  const[fn,sid,field]=el.dataset.change.split(':');
  if(fn==='gpa'){const s2=subj(sid);if(!s2)return;
    if(field==='credits')s2.credits=Math.max(0,Number(el.value)||0);
    if(field==='grade')s2.grade=el.value;
    save();render();}
  if(fn==='exCheck'){const[examId,idx]=sid.split(':');const ex=state.exams.find(x=>x.id===examId);
    if(ex&&ex.checklist[idx]){ex.checklist[idx].done=el.checked;save();}}
  if(fn==='milestone'){const[goalId,idx]=sid.split(':');const g=state.goals.find(x=>x.id===goalId);
    if(g&&g.milestones[idx]){g.milestones[idx].done=el.checked;save();render();}}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.id==='chatIn'){e.preventDefault();Actions.chatSend();}
  const cell=e.target.closest?.('.cal-cell');
  if(cell&&(e.key==='Enter'||e.key===' ')){e.preventDefault();cell.click();}
});

/* ══════════ 14. GLOBAL SEARCH ══════════ */
function globalSearch(q){
  const drop=$('#searchDrop');q=q.trim().toLowerCase();
  if(!q){drop.classList.remove('open');return;}
  const R=[];
  const push=(g,items)=>items.forEach(it=>R.push({g,...it}));
  push('Tasks',state.tasks.filter(x=>x.title.toLowerCase().includes(q)).slice(0,4).map(x=>({label:x.title,sub:fmtDate(x.date),go:()=>{currentView='planner';render();}})));
  push('Subjects',state.subjects.filter(x=>x.name.toLowerCase().includes(q)).slice(0,3).map(x=>({label:x.name,sub:subjectProgress(x)+'%',go:()=>{currentView='subjects';render();}})));
  push('Notes',state.notes.filter(x=>x.title.toLowerCase().includes(q)||x.body.toLowerCase().includes(q)).slice(0,4).map(x=>({label:x.title,sub:'note',go:()=>{currentView='notes';render();Actions.openNote(x.id);}})));
  push('Cards',state.flashcards.filter(x=>x.front.toLowerCase().includes(q)).slice(0,3).map(x=>({label:x.front.slice(0,40),sub:'card',go:()=>{currentView='flashcards';render();}})));
  push('Exams',state.exams.filter(x=>x.name.toLowerCase().includes(q)).slice(0,3).map(x=>({label:x.name,sub:fmtDate(x.date),go:()=>{currentView='exams';render();}})));
  push('Assignments',state.assignments.filter(x=>x.title.toLowerCase().includes(q)).slice(0,3).map(x=>({label:x.title,sub:fmtDate(x.due),go:()=>{currentView='assignments';render();}})));
  push('Tests',state.tests.filter(x=>x.name.toLowerCase().includes(q)).slice(0,3).map(x=>({label:x.name,sub:fmtDate(x.date),go:()=>{currentView='tests';render();}})));
  push('Mistakes',state.mistakes.filter(x=>x.question.toLowerCase().includes(q)).slice(0,3).map(x=>({label:x.question.slice(0,44),sub:fmtDate(x.date),go:()=>{currentView='mistakes';render();}})));
  push('Goals',state.goals.filter(x=>x.title.toLowerCase().includes(q)).slice(0,3).map(x=>({label:x.title,sub:x.type,go:()=>{currentView='goals';render();}})));
  push('Revisions',state.revisions.filter(x=>x.topic.toLowerCase().includes(q)).slice(0,3).map(x=>({label:x.topic,sub:'rev '+fmtDate(x.due),go:()=>{currentView='revision';render();}})));
  drop.innerHTML=R.length?R.map((r,i)=>`<div class="sr-item" data-sr="${i}">${I('search',13)} <span>${esc(r.label)}</span><small>${esc(r.sub)}</small></div>`).join(''):'<div class="empty" style="padding:16px">No matches</div>';
  drop.classList.add('open');
  drop.querySelectorAll('[data-sr]').forEach(el=>el.onclick=()=>{drop.classList.remove('open');R[Number(el.dataset.sr)].go();});
}

  const back=document.createElement('div');back.className='mback';back.style.zIndex=300;
  back.innerHTML=`<div class="modal" style="max-width:620px"><div class="modal-h"><h3>Welcome to AI StudyOS</h3></div>
  <div class="modal-b">
    <div class="ob-progress"><i class="on"></i><i id="obP2"></i><i id="obP3"></i></div>

      <div class="fld"><label>Your name *</label><input id="obName" placeholder="Alex / আরিফ"></div>

    </div>
    <div class="ob-step" data-s="2">
      <p style="margin-bottom:14px;color:var(--ink2);font-size:13.5px">Your daily rhythm — a starter routine builds around it (fully editable later).</p>
      <div class="frow"><div class="fld"><label>Wake-up *</label><input type="time" id="obWake" value="06:30"></div>
      <div class="fld"><label>Sleep *</label><input type="time" id="obSleep" value="23:00"></div></div>
      <label style="display:flex;gap:9px;align-items:center;font-size:13.5px;cursor:pointer;margin-bottom:8px"><input type="checkbox" id="obClasses" checked style="width:auto"> I attend daytime classes/college (blocks 9:00–15:00 weekdays)</label>

      <div class="tabs" style="margin-bottom:16px"><button type="button" id="obLangEn" class="on">${I('lang',13)} English</button><button type="button" id="obLangBn">${I('lang',13)} বাংলা</button></div>
      <div class="frow"><div class="fld"><label>Exam name (optional)</label><input id="obExName" placeholder="Final Mathematics"></div>
      <div class="fld"><label>Exam date</label><input type="date" id="obExDate"></div></div>
      <div class="hint">Say things like <strong>"এখন কী পড়ব?"</strong> or <strong>"set target 4 hours"</strong> — the robot acts on your real data.</div>
    </div>
    <div class="ob-step" data-s="4" style="text-align:center;padding:20px 0">
      <div style="width:52px;height:52px;border-radius:16px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;margin:0 auto 14px">${I('check',24)}</div>
      <h3 style="font-size:20px;margin-bottom:8px" id="obDoneTitle">You're all set!</h3>
      <p id="obDone" style="color:var(--ink2);font-size:13.5px"></p>
    </div>
  </div>
  <div class="modal-f"><button class="btn ghost" id="obBack" style="display:none">Back</button><button class="btn pri" id="obNext">Continue</button></div></div>`;
  document.body.appendChild(back);
  let step=1,voiceLang='en-US';
  back.querySelector('#obLangEn').onclick=()=>{voiceLang='en-US';back.querySelector('#obLangEn').classList.add('on');back.querySelector('#obLangBn').classList.remove('on');};
  back.querySelector('#obLangBn').onclick=()=>{voiceLang='bn-BD';back.querySelector('#obLangBn').classList.add('on');back.querySelector('#obLangEn').classList.remove('on');};
  const show=()=>{back.querySelectorAll('.ob-step').forEach(s=>s.classList.toggle('on',Number(s.dataset.s)===step));
    back.querySelector('#obBack').style.display=step>1&&step<4?'':'none';
    back.querySelector('#obNext').textContent=step===3?'Generate my plan':step===4?'Open dashboard':'Continue';
    back.querySelector('#obP2').classList.toggle('on',step>=2);back.querySelector('#obP3').classList.toggle('on',step>=3);};
  back.querySelector('#obBack').onclick=()=>{step=Math.max(1,step-1);show();};
  back.querySelector('#obNext').onclick=()=>{
    if(step===1){
      if(!back.querySelector('#obName').value.trim()||!back.querySelector('#obSubs').value.trim()){toast('Please fill name and subjects','warn');return;}
      step=2;show();return;}
    if(step===2){step=3;show();return;}
    if(step===3){
      state.user={name:back.querySelector('#obName').value.trim(),goal:back.querySelector('#obGoal').value.trim(),
        targetMin:Math.max(60,Number(back.querySelector('#obHours').value)*60),onboarded:true,
        wake:back.querySelector('#obWake').value||'06:30',sleep:back.querySelector('#obSleep').value||'23:00'};
      state.settings.voiceLang=voiceLang;
      back.querySelector('#obSubs').value.split(',').map(s2=>s2.trim()).filter(Boolean).forEach(n=>state.subjects.push(newSubject(n)));
      const wake=toMin(state.user.wake),sleep=toMin(state.user.sleep);
      const add=(title,category,start,end,priority='medium',subjectId=null)=>{

      if(back.querySelector('#obEx').checked){add('Wake up & morning routine','personal',wake,wake+30);add('Breakfast','meal',wake+30,wake+60);add('Exercise','exercise',wake+60,wake+90);}
      if(back.querySelector('#obClasses').checked)add('Classes / college','class',540,900,'high');
      if(back.querySelector('#obEx').checked)add('Lunch','meal',900,930);
      const target=state.user.targetMin,blocksDesired=Math.min(3,Math.max(1,Math.round(target/75)));
      let cursor=back.querySelector('#obClasses').checked?1020:wake+120;
      for(let i=0;i<blocksDesired;i++){
        const dur=Math.min(90,Math.max(45,Math.round(target/blocksDesired)));
        if(cursor+dur+20>=sleep-30)break;
        add(i===0?'Deep study session':'Study session '+(i+1),'study',cursor,cursor+dur,'high',state.subjects[i%state.subjects.length]?.id||null);
        cursor+=dur+15;}
      add('Wind down & sleep prep','personal',Math.max(cursor+10,sleep-30),Math.min(sleep,1439));
      // prayer preset for bn users
      if(voiceLang==='bn-BD'){add('Namaz / prayer break','personal',1225,1245);add('Asr break','personal',1000,1015);}
      const exName=back.querySelector('#obExName').value.trim(),exDate=back.querySelector('#obExDate').value;
      if(exName&&exDate)state.exams.push({id:uid(),name:exName,subjectId:state.subjects[0]?.id||null,date:exDate,importance:'high',prep:0,chapters:[],checklist:[{text:'Admit card',done:false},{text:'Calculator / pens',done:false}]});
      state.goals.push({id:uid(),title:state.user.goal||'Build a consistent study habit',type:'academic',target:'Establish the daily routine',deadline:addDays(todayISO(),30),progress:0,
        milestones:[{text:'Complete 5 focus sessions',done:false},{text:'Log first test result',done:false}]});
      state.habits.push({id:uid(),name:'Daily study',log:{}});
      saveNow();
      back.querySelector('#obDoneTitle').textContent=voiceLang==='bn-BD'?`স্বাগতম, ${state.user.name}!`:`Welcome, ${state.user.name}!`;
      back.querySelector('#obDone').innerHTML=voiceLang==='bn-BD'
        ?`${state.subjects.length}টা সাবজেক্ট · রুটিন · ${fmtMinBN(target)}/দিন টার্গেট তৈরি হয়েছে।<br>ড্যাশবোর্ডে হলোগ্রাফিক রোবট অপেক্ষা করছে — মাইক চেপে বাংলায় বলুন!`
        :`Generated ${state.subjects.length} subjects · routine · ${fmtMin(target)}/day target.${exName?` Exam countdown started.`:''}<br>Your holographic robot is waiting on the Dashboard — tap the mic and talk!`;
      step=4;show();
      back.querySelector('#obNext').onclick=()=>{back.remove();render();
        Bot.bubble(Bot.greeting());
        if(state.settings.voiceLang==='bn-BD')speak(`স্বাগতম ${state.user.name}! আপনার স্টাডি প্ল্যান তৈরি।`,'bn');
        else speak(`Welcome ${state.user.name}! Your study plan is ready.`,'en');
        toast('Initial study plan ready','ok');};
    }};
}

/* ══════════ 17. BOOT ══════════ */
function applyTheme(){
  document.documentElement.dataset.theme=state.settings.theme;
  document.body.classList.toggle('rm',state.settings.reduceMotion);
  $('#themeBtn').innerHTML=I(state.settings.theme==='light'?'moon':'sun',18);
  $('#userTag').textContent=state.user.name?state.user.name.toLowerCase()+' · study os':'personal assistant';
  // PWA manifest (data URI — installable via "Add to Home Screen")
  const manifest={name:'AI StudyOS',short_name:'StudyOS',display:'standalone',start_url:'.',background_color:'#f4f1ea',theme_color:'#2c6b4f',
    icons:[{src:'data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" rx="22" fill="#2c6b4f"/><path d="M30 68V50a20 20 0 0 1 40 0v18" stroke="#f2f7f3" stroke-width="7" fill="none"/><rect x="42" y="28" width="16" height="14" rx="7" fill="#f2f7f3"/></svg>'),sizes:'any',type:'image/svg+xml'}]};
  let link=document.querySelector('link[rel=manifest]');
  if(!link){link=document.createElement('link');link.rel='manifest';document.head.appendChild(link);}
  link.href='data:application/json,'+encodeURIComponent(JSON.stringify(manifest));
}
async function boot(){
  let loaded=await Store.load();
  if(loaded)loaded=Store.migrate(loaded);
  state=(loaded&&loaded.user)?loaded:freshState();
  // trash auto-expiry (30 days)
  const exp=Date.now()-30*86400000;
  const expired=state.trash.filter(x=>x.at<exp).length;
  if(expired)state.trash=state.trash.filter(x=>x.at>=exp);
  applyTheme();updateBell();
  $('#globalSearch').addEventListener('input',debounce(e=>globalSearch(e.target.value),140));
  document.addEventListener('click',e=>{if(!e.target.closest('.searchbox'))$('#searchDrop').classList.remove('open');});
  window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;});
  $('#clock').textContent=nowHM();
  setInterval(()=>{const c=$('#clock');if(c)c.textContent=nowHM();},30000);
  window.addEventListener('resize',redrawCharts);
  if(!state.user.onboarded){render();onboarding();}
  else{render();
    if(state.meta.lastOpen&&state.meta.lastOpen!==todayISO()){
      const od=outstandingItems().length;
      if(od)setTimeout(()=>pushNotif('Welcome back','You have '+od+' outstanding item(s) from before','out',null),900);}
    state.meta.lastOpen=todayISO();save();}
  if(expired)console.info(`Trash: ${expired} expired item(s) purged (30-day retention).`);
}
boot();
